        const db = getDatabase(app);

        let allRestaurants = [];
        let currentUserName = "ゲストユーザー";

        let targetDeleteId = null;

        document.addEventListener("DOMContentLoaded", () => {
            const groupNameDisplay = document.getElementById("group-name-display");
            const latestListEl = document.getElementById("latest-restaurant-list");
            const allListEl = document.getElementById("all-restaurant-list");
            const loadingEl = document.getElementById("loading");
            const restaurantCountEl = document.getElementById("restaurant-count");

            const openFormModalBtn = document.getElementById("open-form-modal");
            const closeFormModalBtn = document.getElementById("close-form-modal");
            const cancelFormBtn = document.getElementById("cancel-form-btn");

            const submitBtn = document.getElementById("submit-btn");

            const authorInput = document.getElementById("restaurant-author");
            const currentPhotoUrlInput = document.getElementById("current-photo-url");
            const currentPhotoPathInput = document.getElementById("current-photo-path");
            const formModalTitle = document.getElementById("form-modal-title");

            // ジャンル変更によるこだわり表示切替 (投稿フォーム)
            const genreSelect = document.getElementById("restaurant-genre");
            const ramenDetailsContainer = document.getElementById("ramen-details-container");

            function toggleRamenDetails() {
                if (genreSelect && ramenDetailsContainer) {
                    if (genreSelect.value === "ラーメン") {
                        ramenDetailsContainer.classList.remove("hidden");
                    } else {
                        ramenDetailsContainer.classList.add("hidden");
                        document.querySelectorAll('input[name="ramen-detail"]').forEach(cb => cb.checked = false);
                    }
                }

            if (genreSelect) {
                genreSelect.addEventListener("change", toggleRamenDetails);
                toggleRamenDetails();
            }

            // ルーレット用のラーメンこだわり表示切替
            const rouletteGenreSelect = document.getElementById("roulette-genre");
            const rouletteRamenContainer = document.getElementById("roulette-ramen-container");
            const rouletteRamenSelect = document.getElementById("roulette-ramen-genre");

            function toggleRouletteRamenSelect() {
                if (rouletteGenreSelect && rouletteRamenContainer) {
                    if (rouletteGenreSelect.value === "ラーメン") {
                        rouletteRamenContainer.classList.remove("hidden");
                    } else {
                        rouletteRamenContainer.classList.add("hidden");
                        if (rouletteRamenSelect) rouletteRamenSelect.value = "すべて";
                    }
                }
            }

            if (rouletteGenreSelect) {
                rouletteGenreSelect.addEventListener("change", toggleRouletteRamenSelect);
                toggleRouletteRamenSelect();
            }

            // 検索要素
            const searchGenreEl = document.getElementById("search-genre");
            const searchPrefectureEl = document.getElementById("search-prefecture");
            const searchCityEl = document.getElementById("search-city");
            const searchKeywordEl = document.getElementById("search-keyword");
            const executeSearchBtn = document.getElementById("execute-search-btn");

            // モーダル要素
            const detailModal = document.getElementById("detail-modal");
            const detailImage = document.getElementById("detail-image");
            const detailName = document.getElementById("detail-name");
            const detailGenre = document.getElementById("detail-genre");
            const detailRegion = document.getElementById("detail-region");
            const detailScenes = document.getElementById("detail-scenes");
            const detailParking = document.getElementById("detail-parking");
            const detailReservation = document.getElementById("detail-reservation");
            const detailHoliday = document.getElementById("detail-holiday");
            const detailAuthor = document.getElementById("detail-author");
            const detailHp = document.getElementById("detail-hp");
            const detailInsta = document.getElementById("detail-insta");
            const detailMemo = document.getElementById("detail-memo");
            const detailActionButtons = document.getElementById("detail-action-buttons");
            const closeDetailBtn = document.getElementById("close-detail");

            const searchResultModal = document.getElementById("search-result-modal");
            const searchResultListEl = document.getElementById("search-result-list");
            const closeSearchResultModalBtn = document.getElementById("close-search-result-modal");

            const allModal = document.getElementById("all-modal");
            const openAllModalBtn = document.getElementById("open-all-modal");
            const closeAllModalBtn = document.getElementById("close-all-modal");

            const deleteModal = document.getElementById("delete-modal");
            const confirmDeleteBtn = document.getElementById("confirm-delete");
            const deleteCancelBtn = document.getElementById("delete-cancel");

            // 下部ナビからのモーダル制御
            const searchModal = document.getElementById("search-modal");
            const openSearchModalBtn = document.getElementById("open-search-modal");
            const closeSearchModalBtn = document.getElementById("close-search-modal");

            const rouletteModal = document.getElementById("roulette-modal");
            const openRouletteModalBtn = document.getElementById("open-roulette-modal");
            const closeRouletteModalBtn = document.getElementById("close-roulette-modal");

            // 日本地図モーダル関連
            const mapModal = document.getElementById("map-modal");
            const openMapModalBtn = document.getElementById("open-map-modal");
            const closeMapModalBtn = document.getElementById("close-map-modal");
            const prefectureCountEl = document.getElementById("prefecture-count");

            if (openSearchModalBtn) {
                openSearchModalBtn.addEventListener("click", () => {
                    searchModal.classList.remove("hidden");
                    searchModal.classList.add("flex");
                });
            }
            if (closeSearchModalBtn) {
                closeSearchModalBtn.addEventListener("click", () => {
                    searchModal.classList.add("hidden");
                    searchModal.classList.remove("flex");
                });
            }

            if (openRouletteModalBtn) {
                openRouletteModalBtn.addEventListener("click", () => {
                    rouletteModal.classList.remove("hidden");
                    rouletteModal.classList.add("flex");
                });
            }
            if (closeRouletteModalBtn) {
                closeRouletteModalBtn.addEventListener("click", () => {
                    rouletteModal.classList.add("hidden");
                    rouletteModal.classList.remove("flex");
                });
            }

            if (openMapModalBtn) {
                openMapModalBtn.addEventListener("click", () => {
                    updateJapanMap();
                    mapModal.classList.remove("hidden");
                    mapModal.classList.add("flex");
                });
            }
            if (closeMapModalBtn) {
                closeMapModalBtn.addEventListener("click", () => {
                    mapModal.classList.add("hidden");
                    mapModal.classList.remove("flex");
                });
            }

            const rouletteRegionInput = document.getElementById("roulette-region");
            const startRouletteBtn = document.getElementById("start-roulette");
            const rouletteResult = document.getElementById("roulette-result");

            // 投稿モーダルの開閉制御
            if (openFormModalBtn) {
                openFormModalBtn.addEventListener("click", () => {
                    resetFormState();
                    if (formModalTitle) formModalTitle.textContent = "お店を投稿する";
                    if (submitBtn) submitBtn.textContent = "投稿する";
                    formModal.classList.remove("hidden");
                    formModal.classList.add("flex");
                });
            }

            function closeFormModal() {
                if (formModal) {
                    formModal.classList.add("hidden");
                    formModal.classList.remove("flex");
                }
            }

            if (closeFormModalBtn) closeFormModalBtn.addEventListener("click", closeFormModal);
            if (cancelFormBtn) cancelFormBtn.addEventListener("click", closeFormModal);

            // LIFF初期化処理 ＆ ブラウザ判定
            async function initLiff() {
                try {
                    await liff.init({ liffId: "2011348764-dl9CNIS4" });

                    if (!liff.isInClient()) {
                        document.body.innerHTML = `
                            <div class="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col items-center justify-center p-6 text-center">
                                <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl max-w-sm space-y-4 shadow-xl">
                                    <div class="text-3xl">⚠️</div>
                                    <h1 class="text-base font-bold text-white">LINEアプリから開いてください</h1>
                                    <p class="text-xs text-zinc-400 leading-relaxed">
                                        このアプリはLINEグループ内からのみ利用可能です。通常のブラウザ（SafariやChromeなど）からはアクセスできません。
                                    </p>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    if (!liff.isLoggedIn()) {
                        liff.login();
                        return;
                    }

                    const profile = await liff.getProfile();
                    currentUserName = profile.displayName;
                } catch (error) {
                    console.error("LIFF Initialization failed", error);
                }

                if (groupNameDisplay) groupNameDisplay.textContent = "グループ共有中";
                if (authorInput && !authorInput.value) {
                    authorInput.value = currentUserName;
                }
                loadRestaurants();
            }
            initLiff();

            // データのリアルタイム読み込み
            function loadRestaurants() {
                const dbRef = ref(db, 'groups/' + STORAGE_GROUP_ID + '/restaurants');
                onValue(dbRef, (snapshot) => {
                    if (loadingEl) loadingEl.classList.add("hidden");
                    allRestaurants = [];
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        Object.keys(data).forEach((key) => {
                            allRestaurants.push({ id: key, ...data[key] });
                        });
                        allRestaurants.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    }
                    renderRestaurants();
                    updateJapanMap();
                }, (error) => {
                    console.error("Data load failed", error);
                    if (loadingEl) loadingEl.textContent = "データの読み込みに失敗しました。";
                });
            }

            // リスト描画（全件表示）
            function renderRestaurants() {
                if (!latestListEl || !allListEl) return;
                
                if (restaurantCountEl) {
                    restaurantCountEl.textContent = `(${allRestaurants.length}件)`;
                }

                latestListEl.innerHTML = "";
                const latestItems = allRestaurants;

                if (latestItems.length === 0) {
                    latestListEl.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-500 text-xs">登録されているお店がありません。<br>下の「＋ 投稿」ボタンから共有しよう！</div>`;
                    if (openAllModalBtn) openAllModalBtn.classList.add("hidden");
                } else {
                    if (openAllModalBtn) openAllModalBtn.classList.remove("hidden");
                    latestItems.forEach((item) => {
                        latestListEl.appendChild(createCardElement(item));
                    });
                }

                allListEl.innerHTML = "";
                if (allRestaurants.length === 0) {
                    allListEl.innerHTML = `<div class="text-center py-8 text-zinc-500 text-xs col-span-2">登録されているお店がありません。</div>`;
                } else {
                    allRestaurants.forEach((item) => {
                        allListEl.appendChild(createCardElement(item));
                    });
                }
            }

            // 日本地図のピン・色塗り更新処理
            function updateJapanMap() {
                const prefCounts = {};
                allRestaurants.forEach(item => {
                    if (item.prefecture) {
                        let pref = item.prefecture.replace(/(都|道|府|県)$/, '');
                        prefCounts[pref] = (prefCounts[pref] || 0) + 1;
                    }
                });

                const uniqueCount = Object.keys(prefCounts).length;
                if (prefectureCountEl) {
                    prefectureCountEl.textContent = `${uniqueCount} / 47 都道府県制覇`;
                }

                document.querySelectorAll('.pref-path').forEach(path => {
                    const prefName = path.getAttribute('data-pref');
                    const count = prefCounts[prefName] || 0;
                    
                    if (count > 0) {
                        path.classList.remove('fill-zinc-800', 'hover:fill-zinc-700');
                        path.classList.add('fill-[#06C755]', 'hover:fill-[#05b34c]', 'filter', 'drop-shadow-[0_0_4px_rgba(6,199,85,0.6)]');
                    } else {
                        path.classList.remove('fill-[#06C755]', 'hover:fill-[#05b34c]', 'drop-shadow-[0_0_4px_rgba(6,199,85,0.6)]');
                        path.classList.add('fill-zinc-800', 'hover:fill-zinc-700');
                    }
                });

                // リスト側の表示更新
                const mapPrefListEl = document.getElementById("map-prefecture-list");
                if (mapPrefListEl) {
                    mapPrefListEl.innerHTML = "";
                    
                    const allPrefs = [
                        "北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県",
                        "茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県",
                        "新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県",
                        "三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県",
                        "鳥取県","島根県","岡山県","広島県","山口県",
                        "徳島県","香川県","愛媛県","高知県",
                        "福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"
                    ];

                    allPrefs.forEach(pref => {
                        const shortPref = pref.replace(/(都|道|府|県)$/, '');
                        const count = prefCounts[shortPref] || 0;
                        const isVisited = count > 0;

                        const badge = document.createElement("button");
                        badge.className = `p-2 rounded-xl text-xs font-bold border transition flex items-center justify-between ${isVisited ? 'bg-[#06C755]/10 border-[#06C755] text-white shadow-sm' : 'bg-zinc-950 border-zinc-900 text-zinc-500 opacity-60'}`;
                        badge.innerHTML = `
                            <span>${pref}</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded-full ${isVisited ? 'bg-[#06C755] text-zinc-950 font-extrabold' : 'bg-zinc-900 text-zinc-600'}">${isVisited ? `📍 ${count}件` : '未'}</span>
                        `;
                        badge.onclick = () => {
                            if (isVisited) {
                                filterByPrefecture(pref);
                            }
                        };
                        mapPrefListEl.appendChild(badge);
                    });
                }
            }

            // 都道府県クリック・タップ時の絞り込み検索
            window.filterByPrefecture = function(prefName) {
                if (mapModal) {
                    mapModal.classList.add("hidden");
                    mapModal.classList.remove("flex");
                }

                const filtered = allRestaurants.filter(item => {
                    return item.prefecture && item.prefecture.includes(prefName.replace(/(都|道|府|県)$/, ''));
                });

                searchResultListEl.innerHTML = "";
                if (filtered.length === 0) {
                    searchResultListEl.innerHTML = `<div class="text-center py-8 text-zinc-500 text-xs col-span-2">${prefName}のお店は見つかりませんでした。</div>`;
                } else {
                    filtered.forEach(item => {
                        searchResultListEl.appendChild(createCardElement(item));
                    });
                }

                searchResultModal.classList.remove("hidden");
                searchResultModal.classList.add("flex");
            };

            // SVG上の都道府県クリックハンドラ
            window.handlePrefClick = function(prefName) {
                const count = allRestaurants.filter(item => item.prefecture && item.prefecture.includes(prefName)).length;
                if (count > 0) {
                    filterByPrefecture(prefName);
                } else {
                    alert(`${prefName}に登録されているお店はまだありません。`);
                }
            };

            // 検索処理
            if (executeSearchBtn) {
                executeSearchBtn.addEventListener("click", () => {
                    const genreVal = searchGenreEl.value;
                    const prefVal = searchPrefectureEl.value.trim().toLowerCase();
                    const cityVal = searchCityEl.value.trim().toLowerCase();
                    const keywordVal = searchKeywordEl.value.trim().toLowerCase();

                    const filtered = allRestaurants.filter(item => {
                        const matchGenre = (genreVal === "すべて" || item.genre === genreVal);
                        const matchPref = (prefVal === "" || (item.prefecture && item.prefecture.toLowerCase().includes(prefVal)));
                        const matchCity = (cityVal === "" || (item.city && item.city.toLowerCase().includes(cityVal)));
                        
                        const ramenDetailsStr = item.ramenDetails ? item.ramenDetails.join(' ') : '';
                        const paymentsStr = item.payments ? item.payments.join(' ') : '';
                        const fullText = `${item.name || ''} ${item.genre || ''} ${item.memo || ''} ${item.prefecture || ''} ${item.city || ''} ${item.holiday || ''} ${item.author || ''} ${ramenDetailsStr} ${paymentsStr}`.toLowerCase();
                        const matchKeyword = (keywordVal === "" || fullText.includes(keywordVal));

                        return matchGenre && matchPref && matchCity && matchKeyword;
                    });

                    searchResultListEl.innerHTML = "";
                    if (filtered.length === 0) {
                        searchResultListEl.innerHTML = `<div class="text-center py-8 text-zinc-500 text-xs col-span-2">条件に一致するお店が見つかりませんでした。</div>`;
                    } else {
                        filtered.forEach(item => {
                            searchResultListEl.appendChild(createCardElement(item));

                    searchModal.classList.add("hidden");
                    searchModal.classList.remove("flex");

                    searchResultModal.classList.remove("hidden");

            }

            if (closeSearchResultModalBtn) {
                closeSearchResultModalBtn.addEventListener("click", () => {

                    searchResultModal.classList.remove("flex");

            // イッタヨ！ボタン
            window.toggleItkayo = async function(id, event) {
                event.stopPropagation();
                const item = allRestaurants.find(r => r.id === id);
                if (!item) return;

                let likedUsers = item.likedUsers || {};
                const userKey = currentUserName.replace(/[.#$\/\[\]]/g, "_");

                if (likedUsers[userKey]) {
                    delete likedUsers[userKey];
                } else {
                    likedUsers[userKey] = true;
                }

                const itemRef = ref(db, `groups/${STORAGE_GROUP_ID}/restaurants/${id}`);
                try {
                    await update(itemRef, { likedUsers });
                } catch (error) {
                    console.error("イッタヨ更新エラー:", error);
                }
            };

            // カード生成関数
            function createCardElement(item) {
                const card = document.createElement("div");
                const imageUrl = item.photoUrl || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=60";
                const locationStr = `${item.city || ''} ${item.prefecture || ''}`.trim() || '未設定';
                
                const likedUsers = item.likedUsers || {};
                const likeCount = Object.keys(likedUsers).length;
                const userKey = currentUserName.replace(/[.#$\/\[\]]/g, "_");
                const hasLiked = !!likedUsers[userKey];

                card.onclick = () => {
                    if (searchResultModal) {
                        searchResultModal.classList.add("hidden");
                        searchResultModal.classList.remove("flex");
                    }
                    if (allModal) {
                        allModal.classList.add("hidden");
                        allModal.classList.remove("flex");
                    }
                    openDetail(item.id);
                };

                card.className = "bg-zinc-900/80 rounded-2xl overflow-hidden flex flex-col border border-zinc-800/80 hover:border-[#06C755]/50 transition shadow-lg cursor-pointer group";
                card.innerHTML = `
                    <div class="w-full aspect-video bg-zinc-950 relative overflow-hidden flex items-center justify-center">
                        <img src="${imageUrl}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <span class="absolute top-2 right-2 bg-black/70 backdrop-blur-md text-[#06C755] text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-[#06C755]/30">${item.genre || 'その他'}</span>
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-1 space-y-2">
                        <div>
                            <h3 class="font-bold text-xs text-white truncate">${item.name}</h3>
                            <div class="text-[10px] text-zinc-400 truncate mt-0.5">📍 ${locationStr}</div>
                        </div>
                        <div class="pt-2 border-t border-zinc-800/80 flex items-center justify-between">
                            <span class="text-[9px] text-zinc-500 truncate max-w-[80px]">✍️ ${item.author || '不明'}</span>
                            <button onclick="window.toggleItkayo('${item.id}', event)" class="flex items-center gap-1 text-[10px] px-2.5 py-1 rounded-lg border transition ${hasLiked ? 'bg-[#06C755]/20 border-[#06C755] text-[#06C755] font-bold' : 'bg-zinc-800 border-zinc-700 text-zinc-300 hover:bg-zinc-700'}">
                                <span>🚀</span>
                                <span>イッタヨ (${likeCount})</span>
                            </button>
                        </div>
                    </div>
                `;
                return card;
            }

            // 写真圧縮
            function compressImage(file, maxWidth = 800, quality = 0.7) {
                return new Promise((resolve) => {
                    if (!file || !file.type.startsWith('image/')) {
                        resolve(file);
                        return;
                    }

                    let isFinished = false;
                    const timer = setTimeout(() => {
                        if (!isFinished) {
                            isFinished = true;
                            resolve(file);
                        }
                    }, 3000);

                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onerror = () => { if (!isFinished) { isFinished = true; clearTimeout(timer); resolve(file); } };
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onerror = () => { if (!isFinished) { isFinished = true; clearTimeout(timer); resolve(file); } };
                        img.src = event.target.result;
                        img.onload = () => {
                            if (isFinished) return;
                            try {
                                const canvas = document.createElement('canvas');
                                let width = img.width;
                                let height = img.height;

                                if (width > maxWidth) {
                                    height = Math.round((height * maxWidth) / width);
                                    width = maxWidth;
                                }

                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, width, height);

                                canvas.toBlob((blob) => {
                                    if (!isFinished) {
                                        isFinished = true;
                                        clearTimeout(timer);
                                        resolve(blob || file);
                                    }
                                }, 'image/jpeg', quality);
                            } catch (e) {
                                if (!isFinished) { isFinished = true; clearTimeout(timer); resolve(file); }
                            }
                        };
                    };
                });
            }

            // 詳細モーダル
            window.openDetail = function(id) {
                const item = allRestaurants.find(r => r.id === id);
                if (!item) return;

                if (detailImage) detailImage.src = item.photoUrl || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=60";
                if (detailName) detailName.textContent = item.name;
                if (detailGenre) detailGenre.textContent = item.genre || '未設定';
                if (detailRegion) detailRegion.textContent = `${item.country || '日本'} ${item.prefecture || ''} ${item.city || ''}`.trim() || '未設定';
                
                if (detailScenes) detailScenes.textContent = item.scenes && item.scenes.length > 0 ? item.scenes.join(', ') : '未設定';
                if (detailParking) detailParking.textContent = item.parking || '未設定';
                if (detailReservation) detailReservation.textContent = item.reservation || '未設定';
                if (detailHoliday) detailHoliday.textContent = item.holiday || '未設定';
                if (detailAuthor) detailAuthor.textContent = item.author || '不明';
                
                let ramenExtraHtml = '';
                if (item.genre === 'ラーメン' && item.ramenDetails && item.ramenDetails.length > 0) {
                    ramenExtraHtml = `
                        <div>
                            <span class="text-zinc-500 block text-[10px] mb-1">ラーメンのこだわり</span>
                            <div class="flex flex-wrap gap-1">
                                ${item.ramenDetails.map(d => `<span class="text-[10px] bg-[#06C755]/10 text-[#06C755] border border-[#06C755]/30 px-2.5 py-1 rounded-lg">${d}</span>`).join('')}
                            </div>
                        </div>
                    `;
                }

                let paymentsHtml = '';
                if (item.payments && item.payments.length > 0) {
                    paymentsHtml = `
                        <div>
                            <span class="text-zinc-500 block text-[10px] mb-1">決済方法</span>
                            <div class="flex flex-wrap gap-1">
                                ${item.payments.map(p => `<span class="text-[10px] bg-zinc-800 text-zinc-300 border border-zinc-700 px-2.5 py-1 rounded-lg">${p}</span>`).join('')}
                            </div>
                        </div>
                    `;
                }

                if (detailHp) {
                    if (item.hpUrl) {
                        detailHp.innerHTML = `<a href="${item.hpUrl}" target="_blank" class="text-[#06C755] underline truncate block text-xs">🌐 ホームページを見る</a>`;
                        detailHp.classList.remove("hidden");
                    } else {
                        detailHp.classList.add("hidden");
                    }
                }

                if (detailInsta) {
                    if (item.instaUrl) {
                        detailInsta.innerHTML = `<a href="${item.instaUrl}" target="_blank" class="text-pink-400 underline truncate block text-xs">📸 Instagramを見る</a>`;
                        detailInsta.classList.remove("hidden");
                    } else {
                        detailInsta.classList.add("hidden");
                    }
                }

                if (detailMemo) detailMemo.textContent = item.memo || 'メモなし';

                const likedUsers = item.likedUsers || {};
                const likeCount = Object.keys(likedUsers).length;
                const userKey = currentUserName.replace(/[.#$\/\[\]]/g, "_");
                const hasLiked = !!likedUsers[userKey];
                const likedNames = Object.keys(likedUsers).join(', ') || 'なし';

                if (detailActionButtons) {
                    detailActionButtons.innerHTML = `
                        ${ramenExtraHtml}
                        ${paymentsHtml}
                        <div class="space-y-3 pt-3 border-t border-zinc-800 mt-2">
                            <div class="bg-zinc-950/80 p-3 rounded-2xl border border-zinc-800 text-[10px] text-zinc-400 flex items-center justify-between">
                                <span>🚀 イッタヨした人: <strong class="text-zinc-200">${likedNames}</strong></span>
                                <button onclick="window.toggleItkayo('${item.id}', event); window.openDetail('${item.id}');" class="px-3.5 py-1.5 rounded-xl border transition text-xs ${hasLiked ? 'bg-[#06C755]/20 border-[#06C755] text-[#06C755] font-bold' : 'bg-zinc-800 border-zinc-700 text-zinc-300 hover:bg-zinc-700'}">
                                    ${hasLiked ? '取消' : '🚀 イッタヨ'} (${likeCount})
                                </button>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="window.closeDetailAndEdit('${item.id}')" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-3 rounded-2xl text-xs transition">編集する</button>
                                <button onclick="window.closeDetailAndPromptDelete('${item.id}', '${item.photoPath || ''}')" class="flex-1 bg-red-600/80 hover:bg-red-500 text-white font-bold py-3 rounded-2xl text-xs transition">削除する</button>
                            </div>
                        </div>
                    `;
                }

                if (detailModal) {
                    detailModal.classList.remove("hidden");
                    detailModal.classList.add("flex");
                }
            };

            window.closeDetailAndEdit = function(id) {
                if (detailModal) {
                    detailModal.classList.add("hidden");
                    detailModal.classList.remove("flex");
                }
                startEdit(id);
            };

            window.closeDetailAndPromptDelete = function(id, path) {
                if (detailModal) {
                    detailModal.classList.add("hidden");
                    detailModal.classList.remove("flex");
                }
                promptDelete(id, path);
            };

            if (closeDetailBtn) {
                closeDetailBtn.addEventListener("click", () => {
                    detailModal.classList.add("hidden");
                    detailModal.classList.remove("flex");
                });
            }

            if (openAllModalBtn) {
                openAllModalBtn.addEventListener("click", () => {
                    allModal.classList.remove("hidden");
                    allModal.classList.add("flex");
                });
            }

            if (closeAllModalBtn) {
                closeAllModalBtn.addEventListener("click", () => {
                    allModal.classList.add("hidden");
                    allModal.classList.remove("flex");
                });
            }

            // フォーム送信
            if (formEl) {
                formEl.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.textContent = "投稿中...";
                    }

                    const name = document.getElementById("restaurant-name").value;
                    const authorVal = authorInput.value.trim();
                    const genre = document.getElementById("restaurant-genre").value;
                    const country = document.getElementById("restaurant-country").value || "日本";
                    const prefecture = document.getElementById("restaurant-prefecture").value;
                    const city = document.getElementById("restaurant-city").value;
                    const holiday = document.getElementById("restaurant-holiday").value;
                    const hpUrl = document.getElementById("restaurant-hp").value;
                    const instaUrl = document.getElementById("restaurant-insta").value;
                    
                    const scenes = [];
                    document.querySelectorAll('input[name="restaurant-scene"]:checked').forEach(cb => {
                        scenes.push(cb.value);
                    });

                    const ramenDetails = [];
                    if (genre === "ラーメン") {
                        document.querySelectorAll('input[name="ramen-detail"]:checked').forEach(cb => {
                            ramenDetails.push(cb.value);
                        });
                    }

                    const payments = [];
                    document.querySelectorAll('input[name="restaurant-payment"]:checked').forEach(cb => {
                        payments.push(cb.value);
                    });

                    const parking = document.getElementById("restaurant-parking").value;
                    const reservation = document.getElementById("restaurant-reservation").value;
                    const memo = document.getElementById("restaurant-memo").value;
                    const photoFile = document.getElementById("restaurant-photo").files[0];
                    const editId = editIdInput.value;
                    
                    let photoUrl = currentPhotoUrlInput.value;
                    let photoPath = currentPhotoPathInput.value;

                    try {
                        if (photoFile) {
                            if (photoPath) {
                                try {
                                    const oldRef = storageRef(storage, photoPath);
                                    await deleteObject(oldRef);
                                } catch (err) {}
                            }
                            const compressedBlob = await compressImage(photoFile, 800, 0.7);
                            const newPhotoPath = `images/${STORAGE_GROUP_ID}/${Date.now()}_compressed.jpg`;
                            const fileRef = storageRef(storage, newPhotoPath);
                            const snapshot = await uploadBytes(fileRef, compressedBlob);
                            photoUrl = await getDownloadURL(snapshot.ref);
                            photoPath = newPhotoPath;
                        }

                        const dbRef = ref(db, `groups/${STORAGE_GROUP_ID}/restaurants`);
                        
                        const restaurantData = {
                            name, genre, country, prefecture, city, holiday, hpUrl, instaUrl, scenes, ramenDetails, payments, parking, reservation, memo, photoUrl, photoPath,
                            author: authorVal || currentUserName,
                            updatedAt: Date.now()
                        };

                        if (editId) {
                            const updateRef = ref(db, `groups/${STORAGE_GROUP_ID}/restaurants/${editId}`);
                            const existingItem = allRestaurants.find(r => r.id === editId);
                            if (existingItem && existingItem.likedUsers) {
                                restaurantData.likedUsers = existingItem.likedUsers;
                            }
                            await update(updateRef, restaurantData);
                        } else {
                            restaurantData.createdAt = Date.now();
                            const newRef = push(dbRef);
                            await set(newRef, restaurantData);
                        }

                        formEl.reset();
                        document.getElementById("restaurant-country").value = "日本";
                        if (authorInput) authorInput.value = currentUserName;
                        toggleRamenDetails();
                        resetFormState();
                        closeFormModal();
                    } catch (error) {
                        console.error("保存エラー:", error);
                        alert("投稿に失敗しました。もう一度お試しください。");
                    } finally {
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.textContent = editId ? "更新する" : "投稿する";
                        }
                    }
                });
            }

            function startEdit(id) {
                const item = allRestaurants.find(r => r.id === id);
                if (!item) return;

                editIdInput.value = item.id;
                document.getElementById("restaurant-name").value = item.name;
                if (authorInput) authorInput.value = item.author || currentUserName;
                document.getElementById("restaurant-genre").value = item.genre || "ラーメン";
                toggleRamenDetails();

                document.getElementById("restaurant-country").value = item.country || "日本";
                document.getElementById("restaurant-prefecture").value = item.prefecture || "";
                document.getElementById("restaurant-city").value = item.city || "";
                document.getElementById("restaurant-holiday").value = item.holiday || "";
                document.getElementById("restaurant-hp").value = item.hpUrl || "";
                document.getElementById("restaurant-insta").value = item.instaUrl || "";
                
                document.querySelectorAll('input[name="restaurant-scene"]').forEach(cb => {
                    cb.checked = item.scenes && item.scenes.includes(cb.value);
                });

                document.querySelectorAll('input[name="ramen-detail"]').forEach(cb => {
                    cb.checked = item.ramenDetails && item.ramenDetails.includes(cb.value);
                });

                document.querySelectorAll('input[name="restaurant-payment"]').forEach(cb => {
                    cb.checked = item.payments && item.payments.includes(cb.value);
                });

                document.getElementById("restaurant-parking").value = item.parking || "";
                document.getElementById("restaurant-reservation").value = item.reservation || "";
                document.getElementById("restaurant-memo").value = item.memo || "";
                currentPhotoUrlInput.value = item.photoUrl || "";
                currentPhotoPathInput.value = item.photoPath || "";

                if (formModalTitle) formModalTitle.textContent = "お店を編集する";
                if (submitBtn) submitBtn.textContent = "更新する";
                if (formModal) {
                    formModal.classList.remove("hidden");
                    formModal.classList.add("flex");
                }
            }

            function resetFormState() {
                if (formEl) formEl.reset();
                document.getElementById("restaurant-country").value = "日本";
                if (authorInput) authorInput.value = currentUserName;
                toggleRamenDetails();
                editIdInput.value = "";
                currentPhotoUrlInput.value = "";
                currentPhotoPathInput.value = "";
                if (submitBtn) submitBtn.textContent = "投稿する";
                if (formModalTitle) formModalTitle.textContent = "お店を投稿する";
            }

            function promptDelete(id, path) {
                targetDeleteId = id;
                targetDeletePhotoPath = path;
                if (deleteModal) {
                    deleteModal.classList.remove("hidden");
                    deleteModal.classList.add("flex");
                }
            }

            if (deleteCancelBtn) {
                deleteCancelBtn.addEventListener("click", () => {
                    if (deleteModal) {
                        deleteModal.classList.add("hidden");
                        deleteModal.classList.remove("flex");
                    }
                    targetDeleteId = null;
                    targetDeletePhotoPath = null;
                });
            }

            if (confirmDeleteBtn) {
                confirmDeleteBtn.addEventListener("click", async () => {
                    if (!targetDeleteId) return;
                    try {
                        if (targetDeletePhotoPath) {
                            try {
                                const fileRef = storageRef(storage, targetDeletePhotoPath);
                                await deleteObject(fileRef);
                            } catch (err) {}
                        }
                        const itemRef = ref(db, `groups/${STORAGE_GROUP_ID}/restaurants/${targetDeleteId}`);
                        await remove(itemRef);
                        if (deleteModal) {
                            deleteModal.classList.add("hidden");
                            deleteModal.classList.remove("flex");
                        }
                        targetDeleteId = null;
                        targetDeletePhotoPath = null;
                    } catch (error) {
                        alert("削除に失敗しました。");
                    }
                });
            }

            // スロット風ルーレット処理
            if (startRouletteBtn) {
                startRouletteBtn.addEventListener("click", () => {
                    if (allRestaurants.length === 0) {
                        alert("お店が登録されていません！");
                        return;
                    }

                    const selectedGenre = rouletteGenreSelect.value;
                    const selectedRamenDetail = rouletteRamenSelect ? rouletteRamenSelect.value : "すべて";
                    const regionKeyword = rouletteRegionInput.value.trim().toLowerCase();

                    const filtered = allRestaurants.filter(item => {
                        const matchGenre = (selectedGenre === "すべて" || item.genre === selectedGenre);
                        
                        let matchRamen = true;
                        if (selectedGenre === "ラーメン" && selectedRamenDetail !== "すべて") {
                            matchRamen = item.ramenDetails && item.ramenDetails.includes(selectedRamenDetail);
                        }

                        const regionText = `${item.country || ''} ${item.prefecture || ''} ${item.city || ''}`.toLowerCase();
                        const matchRegion = (regionKeyword === "" || regionText.includes(regionKeyword));

                        return matchGenre && matchRamen && matchRegion;
                    });

                    if (filtered.length === 0) {
                        if (rouletteResult) {
                            rouletteResult.innerHTML = `
                                <div class="bg-zinc-950 border border-red-500/40 p-4 rounded-2xl text-center space-y-1">
                                    <p class="text-xs text-red-400 font-bold">⚠️ 条件に合うお店がないよ！</p>
                                    <p class="text-[10px] text-zinc-400">条件を少しゆるくして再チャレンジしてね</p>
                                </div>
                            `;
                        }
                        return;
                    }

                    startRouletteBtn.disabled = true;
                    startRouletteBtn.classList.add("opacity-50", "cursor-not-allowed");

                    let count = 0;
                    const maxCount = 20;
                    let speed = 50;

                    const spin = () => {
                        const randomItem = filtered[Math.floor(Math.random() * filtered.length)];
                        const randomImg = randomItem.photoUrl || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=60";
                        
                        if (rouletteResult) {
                            rouletteResult.innerHTML = `
                                <div class="bg-zinc-950 border border-[#06C755]/50 p-3 rounded-2xl text-center space-y-2 shadow-inner animate-pulse">
                                    <div class="inline-block bg-[#06C755]/20 text-[#06C755] text-[9px] font-bold px-2 py-0.5 rounded-full">🎰 スロット回転中...</div>
                                    <div class="flex items-center gap-3 bg-zinc-900/90 p-2 rounded-xl border border-zinc-800">
                                        <img src="${randomImg}" class="w-12 h-12 object-cover rounded-lg shrink-0">
                                        <div class="text-left overflow-hidden">
                                            <p class="text-xs font-bold text-white truncate">${randomItem.name}</p>
                                            <p class="text-[10px] text-zinc-400 truncate">${randomItem.genre} / ${randomItem.city || 'エリア未設定'}</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }

                        count++;
                        if (count < maxCount) {
                            speed += 10;
                            setTimeout(spin, speed);
                        } else {
                            const winner = filtered[Math.floor(Math.random() * filtered.length)];
                            const winnerImg = winner.photoUrl || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=60";
                            
                            if (rouletteResult) {
                                rouletteResult.innerHTML = `
                                    <div class="bg-gradient-to-b from-[#06C755]/20 to-zinc-950 border-2 border-[#06C755] p-4 rounded-2xl text-center space-y-2 shadow-2xl animate-bounce">
                                        <div class="inline-block bg-[#06C755] text-zinc-950 text-[10px] font-extrabold px-3 py-1 rounded-full shadow-md">🎉 当選！今日のお店はここ！</div>
                                        <div class="bg-zinc-900 p-3 rounded-xl border border-[#06C755]/40 flex items-center gap-3 cursor-pointer group" onclick="openDetail('${winner.id}')">
                                            <img src="${winnerImg}" class="w-14 h-14 object-cover rounded-xl shrink-0 group-hover:scale-105 transition">
                                            <div class="text-left overflow-hidden flex-1">
                                                <p class="text-sm font-extrabold text-white truncate">${winner.name}</p>
                                                <p class="text-[10px] text-[#06C755] font-bold mt-0.5">📍 ${winner.city || 'エリア未設定'} (${winner.genre})</p>
                                                <p class="text-[9px] text-zinc-400 underline mt-1">👆 タップして詳細を見る・決定！</p>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }
                            startRouletteBtn.disabled = false;
                            startRouletteBtn.classList.remove("opacity-50", "cursor-not-allowed");
                        }
                    };

                    spin();
                });
            }
        });
    </script>
</head>

    <!-- 下部固定アクションナビゲーション -->
    <nav class="fixed bottom-0 left-0 right-0 bg-zinc-900/95 backdrop-blur-md border-t border-zinc-800 p-3 z-40 shadow-2xl">
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1.5">

                <span class="text-sm">🗺️</span>
                <span class="text-[9px]">地図を見る</span>
            </button>

                <span class="text-sm">🎲</span>

            </button>
            <button id="open-form-modal" class="bg-[#06C755] hover:bg-[#05b34c] text-zinc-950 text-xs py-2 px-1 rounded-2xl font-extrabold transition flex flex-col items-center justify-center gap-0.5 shadow-lg shadow-[#06C755]/20 active:scale-95">

    </nav>

    <!-- 日本地図モーダル -->
    <div id="map-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4 z-50">
        <div class="bg-zinc-900 border border-zinc-800 rounded-t-3xl sm:rounded-3xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">

                <div>
                    <h3 class="text-xs font-bold text-white flex items-center gap-1.5"><span>🗺️</span> 日本地図・都道府県制覇</h3>
                    <p id="prefecture-count" class="text-[10px] text-[#06C755] font-bold mt-0.5">0 / 47 都道府県制覇</p>

            <div class="p-4 overflow-y-auto space-y-4 flex-1">
                <div class="bg-zinc-950 p-4 rounded-2xl border border-zinc-800 flex flex-col items-center justify-center relative">
                    <p class="text-[10px] text-zinc-400 mb-2">投稿がある都道府県が緑色に光ります💡（タップで詳細）</p>
                    
                    <!-- 綺麗でリアルな日本地図 SVG -->
                    <svg viewBox="0 0 800 800" class="w-full max-w-[320px] h-auto drop-shadow-md">

                        <path class="pref-path fill-zinc-800 cursor-pointer transition-all duration-200" data-pref="岩手" onclick="handlePrefClick('岩手')" d="M680,330 Q720,330 740,380 Q730,440 680,450 Q660,400 680,330 Z" stroke="#27272a" stroke-width="1.5"/>
                        <path class="pref-path fill-zinc-800 cursor-pointer transition-all duration-200" data-pref="秋田" onclick="handlePrefClick('秋田')" d="M600,300 Q650,300 660,370 Q630,430 600,370 Z" stroke="#27272a" stroke-width="1.5"/>
                        <path class="pref-path fill-zinc-800 cursor-pointer transition-all duration-200" data-pref="山形" onclick="handlePrefClick('山形')" d="M600,380 Q640,380 650,450 Q600,470 580,420 Z" stroke="#27272a" stroke-width="1.5"/>
                        <path class="pref-path fill-zinc-800 cursor-pointer transition-all duration-200" data-pref="宮城" onclick="handlePrefClick('宮城')" d="M660,460 Q710,460 700,520 Q650,530 660,460 Z" stroke="#27272a" stroke-width="1.5"/>
                        <path class="pref-path fill-zinc-800 cursor-pointer transition-all duration-200" data-pref="福島" onclick="handlePrefClick('福島')" d="M590,480 Q660,480 680,540 Q630,590 570,540 Z" stroke="#27272a" stroke-width="1.5"/>

                        <!-- 関東エリア -->

                            <label class="flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="ramen-detail" value="二郎系"> 二郎系</label>
                            <label class="flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="ramen-detail" value="家系"> 家系</label>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-zinc-400 mb-1">都道府県</label>
                            <input type="text" id="restaurant-prefecture" placeholder="愛知県" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 text-xs text-white focus:border-[#06C755] focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] text-zinc-400 mb-1">市区町村・エリア</label>
                            <input type="text" id="restaurant-city" placeholder="半田市" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 text-xs text-white focus:border-[#06C755] focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">定休日</label>
                        <input type="text" id="restaurant-holiday" placeholder="例: 月曜日、第2・第4火曜日" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 text-xs text-white focus:border-[#06C755] focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">利用シーン</label>
                        <div class="grid grid-cols-3 gap-2 text-xs text-zinc-300">
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-scene" value="1人OK"> 1人OK</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-scene" value="女子会"> 女子会</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-scene" value="飲み会"> 飲み会</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-scene" value="家族向け"> 家族向け</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-scene" value="接待向け"> 接待向け</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-scene" value="ランチ"> ランチ</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-scene" value="男子会"> 男子会</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-scene" value="記念日"> 記念日</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-scene" value="ディナー"> ディナー</label>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[10px] text-zinc-400 mb-1">駐車場</label>
                            <select id="restaurant-parking" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 text-xs text-white focus:border-[#06C755] focus:outline-none">
                                <option value="">未選択</option>
                                <option value="あり">あり</option>
                                <option value="なし">なし</option>
                                <option value="近くにコインパーキングあり">近くにパーキングあり</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-zinc-400 mb-1">予約</label>
                            <select id="restaurant-reservation" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 text-xs text-white focus:border-[#06C755] focus:outline-none">
                                <option value="">未選択</option>
                                <option value="可">可</option>
                                <option value="不可">不可</option>
                                <option value="推奨">推奨</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">決済方法 (複数選択可)</label>
                        <div class="grid grid-cols-3 gap-2 text-xs text-zinc-300">
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="現金"> 現金</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="クレジットカード"> クレカ</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="電子マネー"> 電子マネー</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="バーコード決済"> バーコード</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="PayPay"> PayPay</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="楽天Pay"> 楽天Pay</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="d払い"> d払い</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="auPay"> auPay</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="メルペイ"> メルペイ</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="J-coinPAY"> J-coinPAY</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="FamiPay"> FamiPay</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="AEONPay"> AEONPay</label>
                            <label class="flex items-center gap-1.5 bg-zinc-950 border border-zinc-800 p-2 rounded-xl"><input type="checkbox" name="restaurant-payment" value="Alipay"> Alipay</label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">ホームページ URL</label>
                        <input type="url" id="restaurant-hp" placeholder="https://..." class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 text-xs text-white focus:border-[#06C755] focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">Instagram URL</label>
                        <input type="url" id="restaurant-insta" placeholder="https://instagram.com/..." class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 text-xs text-white focus:border-[#06C755] focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">メモ・おすすめメニューなど</label>
                        <textarea id="restaurant-memo" rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl px-3 py-2 text-xs text-white focus:border-[#06C755] focus:outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">写真</label>
                        <input type="file" id="restaurant-photo" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-2xl file:border-0 file:text-xs file:font-bold file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700">
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="button" id="cancel-form-btn" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-3 rounded-2xl text-xs transition">キャンセル</button>
                        <button type="submit" id="submit-btn" class="flex-1 bg-[#06C755] hover:bg-[#05b34c] text-zinc-950 font-extrabold py-3 rounded-2xl text-xs transition shadow-lg shadow-[#06C755]/20">投稿する</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 詳細モーダル -->
    <div id="detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-sm overflow-hidden flex flex-col max-h-[85vh]">
            <div class="relative h-44 min-h-[176px] bg-zinc-800 shrink-0">
                <img id="detail-image" src="" alt="" class="w-full h-full object-cover">
                <button id="close-detail" class="absolute top-3 right-3 bg-black/70 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold">✕</button>
            </div>
            <div class="p-4 overflow-y-auto space-y-3 flex-1">
                <div>
                    <span id="detail-genre" class="text-[10px] bg-zinc-800 text-[#06C755] font-bold px-2.5 py-1 rounded-full border border-[#06C755]/30"></span>
                    <h2 id="detail-name" class="text-base font-bold text-white mt-1.5"></h2>
                    <p id="detail-region" class="text-xs text-zinc-400 mt-0.5"></p>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs bg-zinc-950/60 p-3 rounded-2xl border border-zinc-800">
                    <div><span class="text-zinc-500 block text-[10px]">利用シーン</span><span id="detail-scenes" class="text-zinc-200"></span></div>
                    <div><span class="text-zinc-500 block text-[10px]">駐車場 / 予約</span><span id="detail-parking" class="text-zinc-200"></span> / <span id="detail-reservation" class="text-zinc-200"></span></div>
                </div>
                <div class="text-xs bg-zinc-950/60 p-3 rounded-2xl border border-zinc-800">
                    <span class="text-zinc-500 block text-[10px]">定休日</span>
                    <span id="detail-holiday" class="text-zinc-200"></span>
                </div>
                <div id="detail-hp" class="hidden"></div>
                <div id="detail-insta" class="hidden"></div>
                <div>
                    <span class="text-zinc-500 block text-[10px] mb-1">メモ</span>
                    <p id="detail-memo" class="text-xs text-zinc-300 bg-zinc-950/60 p-3 rounded-2xl border border-zinc-800 whitespace-pre-wrap"></p>
                </div>
                <div class="text-[10px] text-zinc-400 text-right">投稿者: <span id="detail-author" class="text-zinc-200 font-bold"></span></div>
                <div id="detail-action-buttons"></div>
            </div>
        </div>
    </div>

    <!-- 検索結果モーダル -->
    <div id="search-result-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex-col z-50 overflow-hidden">
        <div class="bg-zinc-900 border-b border-zinc-800 p-4 flex justify-between items-center shrink-0">
            <h3 class="text-xs font-bold text-white">検索結果 / 都道府県別</h3>
            <button id="close-search-result-modal" class="text-xs text-zinc-400 hover:text-white px-2.5 py-1 rounded-xl bg-zinc-800 font-bold">✕ 閉じる</button>
        </div>
        <div class="p-4 overflow-y-auto flex-1">
            <div id="search-result-list" class="grid grid-cols-2 gap-3 max-w-md mx-auto"></div>
        </div>
    </div>

    <!-- 一覧モーダル -->
    <div id="all-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex-col z-50 overflow-hidden">
        <div class="bg-zinc-900 border-b border-zinc-800 p-4 flex justify-between items-center shrink-0">
            <h3 class="text-xs font-bold text-white">登録されたお店一覧</h3>
            <button id="close-all-modal" class="text-xs text-zinc-400 hover:text-white px-2.5 py-1 rounded-xl bg-zinc-800 font-bold">✕ 閉じる</button>
        </div>
        <div class="p-4 overflow-y-auto flex-1">
            <div id="all-restaurant-list" class="grid grid-cols-2 gap-3 max-w-md mx-auto"></div>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="delete-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 w-full max-w-xs text-center space-y-4 shadow-2xl">
            <h3 class="text-sm font-bold text-white">本当に削除しますか？</h3>
            <p class="text-xs text-zinc-400">この操作は元に戻せません。</p>
            <div class="flex gap-2">
                <button id="delete-cancel" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-2.5 rounded-2xl text-xs transition">キャンセル</button>
                <button id="confirm-delete" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-2xl text-xs transition">削除する</button>
            </div>
        </div>
    </div>
</body>
</html>
