<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？</title>
    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --sub-text: #a0a0a0;
            --accent-color: #ff5722;
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            color: var(--accent-color);
            margin: 0 0 8px 0;
            font-size: 28px;
        }
        p {
            color: var(--sub-text);
            margin: 0;
            font-size: 14px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        h2 {
            font-size: 16px;
            margin: 0 0 12px 0;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background-color: #2c2c2c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        button:active {
            opacity: 0.8;
        }
        .post-item {
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
        }
        .post-item:last-child {
            border-bottom: none;
        }
        .post-image {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
        }
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
        }
        .badge {
            background-color: #333;
            color: #ccc;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .link-btns {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .link-btns a {
            flex: 1;
            text-align: center;
            padding: 6px;
            background: #333;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
        }
        .link-btns a:hover {
            background: #444;
        }
        .no-data {
            text-align: center;
            color: var(--sub-text);
            padding: 12px;
            font-size: 14px;
        }
        .roulette-result {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 8px;
            margin-bottom: 12px;
        }
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            color: white;
            text-align: center;
            padding-top: 50vh;
            font-size: 18px;
        }
        .sub-field-group {
            display: none;
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>
    <div id="loading-overlay">画像を圧縮＆アップロード中...</div>

    <div class="container">
        <header>
            <h1>なにクウ？</h1>
            <p>ご飯迷った時の決定＆写真共有アプリ</p>
        </header>

        <!-- 1. みんなの投稿一覧（一番上） -->
        <div class="card">
            <h2>🍴 みんなの投稿一覧</h2>
            <div id="posts-container">
                <div class="no-data">条件に合う投稿がありません</div>
            </div>
        </div>

        <!-- お店を探す・絞り込む -->
        <div class="card">
            <h2>🔍 お店を探す・絞り込む</h2>
            <input type="text" id="search-keyword" placeholder="検索ワード（例：おしゃれ、美味しい）">
            
            <label style="font-size: 12px; color: #a0a0a0; display: block; margin-bottom: 4px;">ジャンルで絞り込む</label>
            <select id="search-genre">
                <option value="すべて">すべてのジャンル</option>
                <option value="和食">和食</option>
                <option value="洋食">洋食</option>
                <option value="中華">中華</option>
                <option value="定食屋">定食屋</option>
                <option value="ファミレス">ファミレス</option>
                <option value="ラーメン">ラーメン</option>
                <option value="焼肉">焼肉</option>
            </select>

            <!-- 検索用：ラーメンの種類サブ選択 -->
            <div id="search-ramen-sub" class="sub-field-group">
                <label style="font-size: 12px; color: #a0a0a0; display: block; margin-bottom: 4px;">ラーメンの種類</label>
                <select id="search-ramen-type">
                    <option value="すべて">すべてのラーメン</option>
                    <option value="こってり">こってり</option>
                    <option value="あっさり">あっさり</option>
                    <option value="辛い">辛い</option>
                    <option value="家系">家系</option>
                    <option value="二郎系">二郎系</option>
                    <option value="醤油">醤油</option>
                    <option value="みそ">みそ</option>
                    <option value="塩">塩</option>
                    <option value="その他">その他</option>
                </select>
            </div>

            <label style="font-size: 12px; color: #a0a0a0; display: block; margin-bottom: 4px;">現在地からの距離</label>
            <select id="search-distance">
                <option value="all">制限なし（すべて表示）</option>
                <option value="3">3km以内</option>
                <option value="5">5km以内</option>
                <option value="10">10km以内</option>
                <option value="20">20km以内</option>
            </select>
        </div>

        <!-- 投稿フォーム -->
        <div class="card">
            <h2>✏️ お店を投稿する</h2>
            <form id="post-form">
                <select id="genre" required>
                    <option value="">ジャンルを選択 *</option>
                    <option value="和食">和食</option>
                    <option value="洋食">洋食</option>
                    <option value="中華">中華</option>
                    <option value="定食屋">定食屋</option>
                    <option value="ファミレス">ファミレス</option>
                    <option value="ラーメン">ラーメン</option>
                    <option value="焼肉">焼肉</option>
                </select>

                <!-- ラーメン選択時のサブ選択 -->
                <div id="post-ramen-sub" class="sub-field-group">
                    <label style="font-size: 12px; color: #ff5722; display: block; margin-bottom: 4px; font-weight: bold;">🍜 ラーメンの種類を選択 *</label>
                    <select id="ramen-type">
                        <option value="">種類を選択</option>
                        <option value="こってり">こってり</option>
                        <option value="あっさり">あっさり</option>
                        <option value="辛い">辛い</option>
                        <option value="家系">家系</option>
                        <option value="二郎系">二郎系</option>
                        <option value="醤油">醤油</option>
                        <option value="みそ">みそ</option>
                        <option value="塩">塩</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <input type="text" id="shop-name" placeholder="店名 *" required>

                <input type="text" id="state" placeholder="県名（例：愛知県）">
                <input type="text" id="city" placeholder="市名（例：東海市）">
                
                <input type="text" id="holiday" placeholder="定休日（例：水曜日、不定休）">

                <label style="font-size: 12px; color: #a0a0a0; display: block; margin-bottom: 4px;">おすすめの利用シーン</label>
                <select id="target-vibe">
                    <option value="指定なし">利用シーンを選択</option>
                    <option value="1人向け">👤 1人向け</option>
                    <option value="ファミリー向け">👨‍👩‍👧 ファミリー向け</option>
                    <option value="グループ向け">🍻 グループ向け</option>
                </select>

                <label style="font-size: 12px; color: #a0a0a0; display: block; margin-bottom: 4px;">駐車場の有無</label>
                <select id="parking">
                    <option value="不明・記載なし">駐車場の有無を選択</option>
                    <option value="駐車場あり">🅿️ 駐車場あり</option>
                    <option value="駐車場なし">🚫 駐車場なし（近隣コインパーキング等）</option>
                </select>

                <!-- 追加：決済方法 -->
                <label style="font-size: 12px; color: #a0a0a0; display: block; margin-bottom: 4px;">決済方法</label>
                <select id="payment">
                    <option value="不明・記載なし">決済方法を選択</option>
                    <option value="現金のみ">💵 現金のみ</option>
                    <option value="キャッシュレス対応">💳 キャッシュレス対応（クレジット・QR等）</option>
                    <option value="カードのみ">💳 クレジットカードのみ</option>
                </select>

                <label style="font-size: 12px; color: #a0a0a0; display: block; margin-bottom: 4px;">予約の可否</label>
                <select id="reservation">
                    <option value="不明・記載なし">予約の可否を選択</option>
                    <option value="予約可能">⭕ 予約可能</option>
                    <option value="予約不可">❌ 予約不可</option>
                    <option value="要確認">⚠️ 要確認</option>
                </select>

                <input type="url" id="hp-url" placeholder="ホームページのURL（https://...）">
                <input type="url" id="insta-url" placeholder="InstagramのURL（https://...）">
                <textarea id="comment" placeholder="コメント・おすすめメニューなど" rows="3"></textarea>
                
                <label style="font-size: 12px; color: #a0a0a0; display: block; margin-bottom: 4px;">お店の写真（1枚・自動圧縮されます）</label>
                <input type="file" id="image-file" accept="image/*">
                
                <input type="text" id="author" placeholder="投稿者名（自動取得）" readonly>
                <button type="submit">📍 現在地を登録して投稿する</button>
            </form>
        </div>

        <!-- 2. ルーレット機能（一番下） -->
        <div class="card">
            <h2>🎰 2段階ルーレットで決める</h2>
            
            <button id="roulette-genre-btn" type="button">1. ジャンルを決める！</button>
            <div id="roulette-genre-result" class="roulette-result">ジャンル未選択</div>

            <button id="roulette-shop-btn" type="button" style="background-color: #4CAF50;">2. このジャンルでお店を決める！</button>
            <div id="roulette-shop-result" class="roulette-result">お店未決定</div>
        </div>
    </div>

    <script>
        // --- Firebaseの設定 ---
        const firebaseConfig = {
            databaseURL: "https://nanikuu-default-rtdb.firebaseio.com/",
            storageBucket: "nanikuu.appspot.com"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const storage = firebase.storage();

        let allPosts = [];
        let selectedGenreForRoulette = "";
        let currentLat = null;
        let currentLng = null;

        // --- ユーザーの現在地を取得しておく ---
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                },
                (error) => {
                    console.log("位置情報取得エラー: " + error.message);
                },
                { enableHighAccuracy: true }
            );
        }

        // --- 2地点間の距離（km）を計算する関数（ヒュベニの公式） ---
        function calcDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return null;
            const radLat1 = lat1 * Math.PI / 180;
            const radLat2 = lat2 * Math.PI / 180;
            const radDistLat = (lat1 - lat2) * Math.PI / 180;
            const radDistLon = (lon1 - lon2) * Math.PI / 180;

            const a = Math.sin(radDistLat / 2) * Math.sin(radDistLat / 2) +
                      Math.cos(radLat1) * Math.cos(radLat2) *
                      Math.sin(radDistLon / 2) * Math.sin(radDistLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const r = 6371; // 地球の半径(km)
            return r * c;
        }

        // --- 画像圧縮関数（Canvas使用・最大幅800px・画質0.7） ---
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', 0.7);
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // --- 投稿フォーム：ラーメン選択連動 ---
        document.getElementById('genre').addEventListener('change', (e) => {
            const subField = document.getElementById('post-ramen-sub');
            const ramenSelect = document.getElementById('ramen-type');
            if (e.target.value === 'ラーメン') {
                subField.style.display = 'block';
                ramenSelect.required = true;
            } else {
                subField.style.display = 'none';
                ramenSelect.required = false;
                ramenSelect.value = '';
            }
        });

        // --- 検索：ラーメン選択連動 ---
        document.getElementById('search-genre').addEventListener('change', (e) => {
            const subField = document.getElementById('search-ramen-sub');
            if (e.target.value === 'ラーメン') {
                subField.style.display = 'block';
            } else {
                subField.style.display = 'none';
                document.getElementById('search-ramen-type').value = 'すべて';
            }
            filterPosts();
        });

        // --- データのリアルタイム取得 ---
        db.ref('posts').on('value', (snapshot) => {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            allPosts = [];
            
            if (!snapshot.exists()) {
                container.innerHTML = '<div class="no-data">条件に合う投稿がありません</div>';
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const post = childSnapshot.val();
                post.id = childSnapshot.key;
                allPosts.push(post);
            });

            filterPosts();
        });

        // --- 投稿一覧の描画関数 ---
        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<div class="no-data">条件に合う投稿がありません</div>';
                return;
            }

            const sorted = [...posts].reverse();

            sorted.forEach((post) => {
                let mapUrl = "";
                if (post.lat && post.lng) {
                    mapUrl = `https://www.google.com/maps/search/?api=1&query=${post.lat},${post.lng}`;
                } else {
                    const mapQuery = encodeURIComponent(`${post.state || ''}${post.city || ''} ${post.shopName}`);
                    mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;
                }

                let distanceText = "";
                if (currentLat && currentLng && post.lat && post.lng) {
                    const dist = calcDistance(currentLat, currentLng, post.lat, post.lng);
                    if (dist !== null) {
                        distanceText = `<small style="color: #ff5722; margin-left: 6px;">(約 ${dist.toFixed(1)} km)</small>`;
                    }
                }

                let badgesHtml = '';
                if (post.genre === 'ラーメン' && post.ramenType) badgesHtml += `<span class="badge" style="background:#ff5722; color:#fff;">🍜 ${escapeHtml(post.ramenType)}</span>`;
                if (post.holiday) badgesHtml += `<span class="badge">店休: ${escapeHtml(post.holiday)}</span>`;
                if (post.targetVibe && post.targetVibe !== '指定なし') badgesHtml += `<span class="badge">${escapeHtml(post.targetVibe)}</span>`;
                if (post.parking && post.parking !== '不明・記載なし') badgesHtml += `<span class="badge">${escapeHtml(post.parking)}</span>`;
                if (post.payment && post.payment !== '不明・記載なし') badgesHtml += `<span class="badge">${escapeHtml(post.payment)}</span>`;
                if (post.reservation && post.reservation !== '不明・記載なし') badgesHtml += `<span class="badge">${escapeHtml(post.reservation)}</span>`;

                const div = document.createElement('div');
                div.className = 'post-item';
                div.innerHTML = `
                    <strong>${escapeHtml(post.shopName)}</strong> (${escapeHtml(post.genre)})<br>
                    <small>📍 ${escapeHtml(post.state || '')} ${escapeHtml(post.city || '')}</small> ${distanceText}
                    <a href="${mapUrl}" target="_blank" style="font-size: 12px; color: #4fa3ff; margin-left: 8px; text-decoration: none;">🗺️ 地図アプリで開く</a><br>
                    
                    ${badgesHtml ? `<div class="tags-container">${badgesHtml}</div>` : ''}
                    ${post.comment ? `<p style="margin: 6px 0; color: #ddd;">${escapeHtml(post.comment)}</p>` : ''}
                    ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image" alt="投稿画像">` : ''}
                    
                    <div class="link-btns">
                        ${post.hpUrl ? `<a href="${escapeHtml(post.hpUrl)}" target="_blank">🌐 HPを見る</a>` : ''}
                        ${post.instaUrl ? `<a href="${escapeHtml(post.instaUrl)}" target="_blank">📷 Instagram</a>` : ''}
                    </div>

                    <small style="color: #a0a0a0; display: block; margin-top: 6px;">投稿者: ${escapeHtml(post.author)}</small>
                `;
                container.appendChild(div);
            });
        }

        // --- 検索・絞り込み機能 ---
        function filterPosts() {
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const genre = document.getElementById('search-genre').value;
            const ramenType = document.getElementById('search-ramen-type').value;
            const maxDistance = document.getElementById('search-distance').value;

            const filtered = allPosts.filter(post => {
                const matchGenre = (genre === 'すべて' || post.genre === genre);
                
                let matchRamen = true;
                if (genre === 'ラーメン' && ramenType !== 'すべて') {
                    matchRamen = (post.ramenType === ramenType);
                }

                let matchDistance = true;
                if (maxDistance !== 'all' && currentLat && currentLng && post.lat && post.lng) {
                    const dist = calcDistance(currentLat, currentLng, post.lat, post.lng);
                    if (dist === null || dist > parseFloat(maxDistance)) {
                        matchDistance = false;
                    }
                }

                const text = `${post.shopName} ${post.genre} ${post.ramenType || ''} ${post.state} ${post.city} ${post.holiday} ${post.targetVibe} ${post.parking} ${post.payment || ''} ${post.reservation} ${post.comment} ${post.author}`.toLowerCase();
                const matchKeyword = text.includes(keyword);

                return matchGenre && matchRamen && matchDistance && matchKeyword;
            });

            renderPosts(filtered);
        }

        document.getElementById('search-keyword').addEventListener('input', filterPosts);
        document.getElementById('search-ramen-type').addEventListener('change', filterPosts);
        document.getElementById('search-distance').addEventListener('change', filterPosts);

        // --- ルーレット機能（2段階） ---
        document.getElementById('roulette-genre-btn').addEventListener('click', () => {
            if (allPosts.length === 0) {
                document.getElementById('roulette-genre-result').innerText = '投稿がありません！';
                return;
            }
            const genres = [...new Set(allPosts.map(p => p.genre))];
            const randomGenre = genres[Math.floor(Math.random() * genres.length)];
            
            selectedGenreForRoulette = randomGenre;
            document.getElementById('roulette-genre-result').innerText = `🎯 ジャンルは【 ${randomGenre} 】に決定！`;
            document.getElementById('roulette-shop-result').innerText = '下のボタンを押してお店を決めよう！';
        });

        document.getElementById('roulette-shop-btn').addEventListener('click', () => {
            if (allPosts.length === 0) {
                document.getElementById('roulette-shop-result').innerText = '投稿がありません！';
                return;
            }

            let targetPosts = allPosts;
            if (selectedGenreForRoulette) {
                targetPosts = allPosts.filter(p => p.genre === selectedGenreForRoulette);
            }

            if (targetPosts.length === 0) {
                document.getElementById('roulette-shop-result').innerText = '該当するジャンルのお店がありません';
                return;
            }

            const picked = targetPosts[Math.floor(Math.random() * targetPosts.length)];
            document.getElementById('roulette-shop-result').innerText = `🎉 【 ${picked.shopName} 】 (${picked.genre}) に決定！`;
        });

        // --- 投稿フォーム送信処理 ---
        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const genre = document.getElementById('genre').value;
            const ramenType = genre === 'ラーメン' ? document.getElementById('ramen-type').value : '';
            const shopName = document.getElementById('shop-name').value;
            const state = document.getElementById('state').value;
            const city = document.getElementById('city').value;
            const holiday = document.getElementById('holiday').value;
            const targetVibe = document.getElementById('target-vibe').value;
            const parking = document.getElementById('parking').value;
            const payment = document.getElementById('payment').value;
            const reservation = document.getElementById('reservation').value;
            const hpUrl = document.getElementById('hp-url').value;
            const instaUrl = document.getElementById('insta-url').value;
            const comment = document.getElementById('comment').value;
            const author = document.getElementById('author').value || "ゲスト";
            const imageFile = document.getElementById('image-file').files[0];

            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'block';

            try {
                let imageUrl = "";

                if (imageFile) {
                    const compressedBlob = await compressImage(imageFile);
                    const storageRef = storage.ref();
                    const imageRef = storageRef.child('images/' + Date.now() + '_' + imageFile.name);
                    const snapshot = await imageRef.put(compressedBlob);
                    imageUrl = await snapshot.ref.getDownloadURL();
                }

                const postLat = currentLat;
                const postLng = currentLng;

                await db.ref('posts').push({
                    genre,
                    ramenType,
                    shopName,
                    state,
                    city,
                    holiday,
                    targetVibe,
                    parking,
                    payment,
                    reservation,
                    hpUrl,
                    instaUrl,
                    comment,
                    imageUrl,
                    author,
                    lat: postLat,
                    lng: postLng,
                    timestamp: Date.now()
                });

                alert('投稿しました！');
                document.getElementById('post-form').reset();
                document.getElementById('post-ramen-sub').style.display = 'none';
                if (window.currentLiffName) {
                    document.getElementById('author').value = window.currentLiffName;
                }
            } catch (error) {
                alert('エラーが発生しました: ' + error.message);
            } finally {
                loadingOverlay.style.display = 'none';
            }
        });

        // --- XSS対策のエスケープ関数 ---
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`<>]/g, function(match) {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '<': '&lt;',
                    '>': '&gt;',
                }[match];
            });
        }

        // --- LIFF初期化 ---
        window.currentLiffName = "ゲスト";
        document.addEventListener("DOMContentLoaded", () => {
            try {
                liff.init({ liffId: "2011348764-TFzS41F9" })
                    .then(() => {
                        if (liff.isLoggedIn()) {
                            liff.getProfile().then(profile => {
                                window.currentLiffName = profile.displayName;
                                const authorInput = document.getElementById('author');
                                if (authorInput) {
                                    authorInput.value = window.currentLiffName;
                                }
                            }).catch(() => {});
                        }
                    })
                    .catch((err) => {
                        console.log("LIFF init error ignored: ", err);
                    });
            } catch (e) {
                console.log("LIFF not available");
            }
        });
    </script>
</body>
</html>
