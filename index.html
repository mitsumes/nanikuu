<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title>なにクウ？</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    // Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyDpani9pMAqzS4KhctYUXH...",
      authDomain: "nanikuu.firebaseapp.com",
      databaseURL: "https://nanikuu-default-rtdb.firebaseio.com",
      projectId: "nanikuu",
      storageBucket: "nanikuu.firebasestorage.app",
      messagingSenderId: "926924103144",
      appId: "1:926924103144:web:285b58f3b..."
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const postsRef = ref(db, 'posts');

    // グローバル変数として保持
    window.db = db;
    window.postsRef = postsRef;
    window.push = push;
    window.update = update;
    window.remove = remove;
    window.ref = ref;

    // データベースの変更を監視（リアルタイム反映）
    onValue(postsRef, (snapshot) => {
      const data = snapshot.val();
      window.posts = [];
      if (data) {
        Object.keys(data).forEach(key => {
          window.posts.unshift({
            id: key,
            ...data[key]
          });
        });
      }
      if (typeof window.renderPosts === "function") {
        window.renderPosts();
      }
    });
  </script>

  <style>

      --card-bg: #1e1e1e;

    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); overflow-x: hidden; }
    .container { max-width: 480px; margin: 0 auto; display: block; } /* 常に表示するように変更 */
    
    /* ブロック画面（今回は非表示にして強制突破） */
    #blocked-screen { display: none; text-align: center; padding: 50px 20px; }

    select, input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: var(--input-bg); color: #fff; border: 1px solid var(--input-border); border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }

    /* チェックボックスグループ */

    /* ルーレット表示エリア */
    .roulette-box { background: #261c1a; border: 2px dashed #ff7043; border-radius: 12px; padding: 15px; text-align: center; font-size: 1.1rem; font-weight: bold; color: var(--primary); min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 10px; }

    /* 投稿カード */
    .post-card { border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; margin-top: 10px; background: var(--card-bg); position: relative; }

<script>
  window.posts = [];
  let currentUserName = "ゲストユーザー";

  // 安全にLIFFを初期化（失敗しても画面が消えないように修正）
  document.addEventListener("DOMContentLoaded", () => {
    try {
      liff.init({ liffId: "2011348764-TFzS41F9" }).then(() => {
        if (liff.isLoggedIn()) {
          liff.getProfile().then(profile => {
            currentUserName = profile.displayName;
            document.getElementById('author').value = currentUserName;
          }).catch(() => {});
        }
      }).catch((err) => {
        console.log("LIFF initialization skipped/failed: ", err);
      });
    } catch (e) {
      console.log("LIFF not available");
    }
  });

  // 国切り替え制御
  function toggleCountryInput() {
    const isForeign = document.getElementById('countryType').value === '海外';
    document.getElementById('japanLocation').style.display = isForeign ? 'none' : 'block';
    document.getElementById('foreignLocation').style.display = isForeign ? 'block' : 'none';
  }

  // 投稿一覧の描画
  window.renderPosts = function() {
    const listEl = document.getElementById('postsList');
    const keyword = document.getElementById('searchKeyword').value.toLowerCase();
    const filterCat = document.getElementById('filterCategory').value;
    const checkedPeople = Array.from(document.querySelectorAll('.filter-people-opt:checked')).map(cb => cb.value);

    const filtered = window.posts.filter(p => {
      const matchCat = (filterCat === 'すべて' || p.category === filterCat);
      const matchPeople = checkedPeople.length === 0 || (p.people && checkedPeople.some(pe => p.people.includes(pe)));
      const textTarget = `${p.shopName || ''} ${p.menuName || ''} ${p.comment || ''} ${p.prefecture || ''} ${p.city || ''}`.toLowerCase();
      const matchKeyword = !keyword || textTarget.includes(keyword);
      return matchCat && matchPeople && matchKeyword;
    });

    if (filtered.length === 0) {
      listEl.innerHTML = `<p style="text-align:center; color:var(--text-sub); font-size:0.9rem; padding:15px;">条件に合う投稿がありません</p>`;
      return;
    }

    let html = '';
    filtered.forEach(p => {
      let locText = "";
      if (p.countryType === '海外') {
        locText = `${p.countryName || ''} ${p.foreignCity || ''}`;
      } else {
        locText = `${p.prefecture || ''} ${p.city || ''}`;
      }

      let peopleTags = (p.people || []).map(pe => `<span class="tag">${pe}</span>`).join('');
      let menuHtml = p.menuName ? `<div class="post-menu">🥢 ${p.menuName}</div>` : '';
      let commentHtml = p.comment ? `<div class="post-comment-preview">💬 ${p.comment}</div>` : '';
      
      let linksHtml = '';
      if (p.hp) linksHtml += `<a href="${p.hp}" target="_blank">🌐 HP</a>`;
      if (p.insta) linksHtml += `<a href="${p.insta}" target="_blank">📸 Instagram</a>`;

      let actionButtons = `
        <div style="margin-top: 10px;">
          <button class="btn-edit" onclick="editPost('${p.id}')">編集</button>
          <button class="btn-delete" onclick="deletePost('${p.id}')">削除</button>
        </div>
      `;

      html += `
        <div class="post-card">
          <img class="post-img" src="${p.img}" alt="写真" onclick="openModal('${p.id}')">
          <div class="post-body">
            <div class="post-header">
              <div>
                <h3 class="post-title">${p.shopName}</h3>
                <div style="font-size:0.75rem; color:var(--text-sub);">📍 ${locText || '場所未設定'}</div>
              </div>
              <span class="tag" style="background:var(--primary);">${p.category}</span>
            </div>
            ${menuHtml}
            ${commentHtml}
            <div class="post-meta">
              👤 ${p.author || 'ゲスト'} ／ 定休: ${p.holiday || 'なし'} ／ ${p.reservation || '予約不明'}
            </div>
            <div>${peopleTags}</div>
            <div class="links">${linksHtml}</div>
            ${actionButtons}
          </div>
        </div>
      `;
    });
    listEl.innerHTML = html;
  };

  // ルーレット
  function spinPhotoRoulette() {
    const textDiv = document.getElementById('rouletteText');
    const imgEl = document.getElementById('rouletteImg');
    const checkedCategories = Array.from(document.querySelectorAll('.roulette-opt:checked')).map(cb => cb.value);

    if (checkedCategories.length === 0) {
      alert("ジャンルを1つ以上選択してください！");
      return;
    }

    const filteredPosts = window.posts.filter(p => checkedCategories.includes(p.category));

    if (filteredPosts.length === 0) {
      alert("選択したジャンルの投稿がまだありません。お店を投稿してみてください！");
      return;
    }

    let count = 0;
    imgEl.style.display = "block";

    const timer = setInterval(() => {
      const randomPost = filteredPosts[Math.floor(Math.random() * filteredPosts.length)];
      imgEl.src = randomPost.img;
      const menuText = randomPost.menuName ? ` / 🥢 ${randomPost.menuName}` : '';
      textDiv.innerHTML = `🎰 ${randomPost.shopName}${menuText} (${randomPost.category})`;
      
      count++;
      if (count > 15) {
        clearInterval(timer);
        const finalPost = filteredPosts[Math.floor(Math.random() * filteredPosts.length)];
        imgEl.src = finalPost.img;
        
        let locQuery = "";
        let locText = "";
        if (finalPost.countryType === '海外') {
          locQuery = `${finalPost.countryName || ''}${finalPost.foreignCity || ''} ${finalPost.shopName}`;
          locText = (finalPost.countryName || finalPost.foreignCity) ? `（${finalPost.countryName || ''} ${finalPost.foreignCity || ''}）` : '';
        } else {
          locQuery = `${finalPost.prefecture || ''}${finalPost.city || ''} ${finalPost.shopName}`;
          locText = (finalPost.prefecture || finalPost.city) ? `（${finalPost.prefecture || ''}${finalPost.city || ''}）` : '';
        }

        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(locQuery)}`;
        const finalMenuText = finalPost.menuName ? `<br>おすすめ: <b>${finalPost.menuName}</b>` : '';

        textDiv.innerHTML = `
          🎉 今日のご飯は <b>【${finalPost.shopName}】</b>${locText}！${finalMenuText}<br>
          <a href="${mapUrl}" target="_blank" style="color: #64b5f6; font-size: 0.9rem;">📍 Googleマップで見る</a>
        `;
      }
    }, 80);
  }

  // 画像圧縮
  function compressImage(file, maxWidth = 800, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth || height > maxWidth) {
            if (width > height) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            } else {
              width = Math.round((width * maxWidth) / height);
              height = maxWidth;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
          resolve(compressedBase64);
        };
        img.onerror = (err) => reject(err);
      };
      reader.onerror = (err) => reject(err);
    });
  }

  // 投稿保存
  async function savePost() {
    const editingId = document.getElementById('editingPostId').value;
    const author = document.getElementById('author').value || currentUserName;
    const shopName = document.getElementById('shopName').value.trim();
    const menuName = document.getElementById('menuName').value.trim();
    const comment = document.getElementById('comment').value.trim();
    const countryType = document.getElementById('countryType').value;
    const prefecture = document.getElementById('prefecture').value.trim();
    const city = document.getElementById('city').value.trim();
    const countryName = document.getElementById('countryName').value.trim();
    const foreignCity = document.getElementById('foreignCity').value.trim();
    
    const category = document.getElementById('shopCategory').value;
    const people = Array.from(document.querySelectorAll('.post-people-opt:checked')).map(cb => cb.value);
    
    const holiday = document.getElementById('holiday').value.trim() || "なし";
    const reservation = document.getElementById('reservation').value;
    const hp = document.getElementById('hpUrl').value.trim();
    const insta = document.getElementById('instaUrl').value.trim();
    
    const photoInput = document.getElementById('photo');

    if (!shopName) {
      alert("店名を入力してください！");
      return;
    }

    let mainImgUrl = null;
    if (photoInput.files && photoInput.files[0]) {
      try {
        mainImgUrl = await compressImage(photoInput.files[0], 800, 0.7);
        if (mainImgUrl.length > 700000) {
          alert("画像サイズが大きすぎます。別の画像を選択してください。");
          return;
        }
      } catch (e) {
        alert("画像の処理に失敗しました。");
        return;
      }
    }

    const postData = {
      author, shopName, menuName, comment, countryType, prefecture, city, countryName, foreignCity,
      category, people, holiday, reservation, hp, insta,
      updatedAt: Date.now()
    };

    if (mainImgUrl) postData.img = mainImgUrl;

    if (editingId) {
      const targetRef = window.ref(window.db, `posts/${editingId}`);
      window.update(targetRef, postData).then(() => {
        alert("投稿を更新しました！");
        resetForm();
      }).catch(err => alert("更新失敗: " + err.message));
    } else {
      postData.createdAt = Date.now();
      if (!postData.img) {
        postData.img = "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=500&auto=format&fit=crop";
      }
      window.push(window.postsRef, postData).then(() => {
        alert("投稿しました！グループ全員に共有されたよ！");
        resetForm();
      }).catch(err => alert("保存失敗: " + err.message));
    }
  }

  // 編集モード
  function editPost(id) {
    const post = window.posts.find(p => p.id === id);
    if (!post) return;

    document.getElementById('editingPostId').value = post.id;
    document.getElementById('shopName').value = post.shopName || '';
    document.getElementById('menuName').value = post.menuName || '';
    document.getElementById('comment').value = post.comment || '';
    
    const cType = post.countryType || '日本';
    document.getElementById('countryType').value = cType;
    toggleCountryInput();

    document.getElementById('prefecture').value = post.prefecture || '';
    document.getElementById('city').value = post.city || '';
    document.getElementById('countryName').value = post.countryName || '';
    document.getElementById('foreignCity').value = post.foreignCity || '';
    document.getElementById('shopCategory').value = post.category || 'ラーメン';
    
    document.querySelectorAll('.post-people-opt').forEach(cb => {
      cb.checked = post.people && post.people.includes(cb.value);
    });

    document.getElementById('holiday').value = post.holiday || '';
    document.getElementById('reservation').value = post.reservation || '予約可';
    document.getElementById('hpUrl').value = post.hp || '';
    document.getElementById('instaUrl').value = post.insta || '';

    document.getElementById('formTitle').innerText = "✏️ 投稿を編集";
    document.getElementById('submitBtn').innerText = "更新する";
    document.getElementById('cancelBtn').style.display = "block";
    
    window.scrollTo({ top: document.getElementById('formCard').offsetTop, behavior: 'smooth' });
  }

  // 削除
  function deletePost(id) {
    if (confirm("本当にこの投稿を削除しますか？")) {
      const targetRef = window.ref(window.db, `posts/${id}`);
      window.remove(targetRef).then(() => {
        alert("削除しました。");
      }).catch(err => alert("削除失敗: " + err.message));
    }
  }

  // フォームリセット
  function resetForm() {
    document.getElementById('editingPostId').value = "";
    document.getElementById('shopName').value = "";
    document.getElementById('menuName').value = "";
    document.getElementById('comment').value = "";
    document.getElementById('prefecture').value = "";
    document.getElementById('city').value = "";
    document.getElementById('countryName').value = "";
    document.getElementById('foreignCity').value = "";
    document.getElementById('holiday').value = "";
    document.getElementById('hpUrl').value = "";
    document.getElementById('instaUrl').value = "";
    document.getElementById('photo').value = "";
    document.querySelectorAll('.post-people-opt').forEach(cb => cb.checked = false);

    document.getElementById('formTitle').innerText = "📸 おすすめのお店を投稿";
    document.getElementById('submitBtn').innerText = "投稿する";
    document.getElementById('cancelBtn').style.display = "none";
  }

  // モーダル詳細表示
  function openModal(id) {
    const post = window.posts.find(p => p.id === id);
    if (!post) return;

    document.getElementById('modalShopName').innerText = post.shopName;
    document.getElementById('modalMenuName').innerText = post.menuName ? `🥢 ${post.menuName}` : '';
    document.getElementById('modalAuthor').innerText = `投稿者: ${post.author || 'ゲスト'}`;
    document.getElementById('modalComment').innerText = post.comment || 'コメントなし';
    document.getElementById('modalImg').src = post.img;

    document.getElementById('detailModal').style.display = 'block';
  }

  function closeModal() {
    document.getElementById('detailModal').style.display = 'none';
  }
</script>

</body>
</html>
