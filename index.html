    <script>
        // --- Firebaseの設定 ---
        const firebaseConfig = {
            databaseURL: "https://nanikuu-default-rtdb.firebaseio.com/",
            storageBucket: "nanikuu.appspot.com"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const storage = firebase.storage();

        let allPosts = [];
        let selectedGenreForRoulette = "";
        window.currentLiffName = "ゲスト";

        // --- 画像圧縮関数（Canvas使用・最大幅800px・画質0.7） ---
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', 0.7);
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // --- 投稿フォーム：ラーメン選択連動 ---
        document.getElementById('genre').addEventListener('change', (e) => {
            const subField = document.getElementById('post-ramen-sub');
            const ramenSelect = document.getElementById('ramen-type');
            if (e.target.value === 'ラーメン') {
                subField.style.display = 'block';
                ramenSelect.required = true;
            } else {
                subField.style.display = 'none';
                ramenSelect.required = false;
                ramenSelect.value = '';
            }
        });

        // --- 編集フォーム：ラーメン選択連動 ---
        document.getElementById('edit-genre').addEventListener('change', (e) => {
            const subField = document.getElementById('edit-ramen-sub');
            const ramenSelect = document.getElementById('edit-ramen-type');
            if (e.target.value === 'ラーメン') {
                subField.style.display = 'block';
                ramenSelect.required = true;
            } else {
                subField.style.display = 'none';
                ramenSelect.required = false;
                ramenSelect.value = '';
            }
        });

        // --- 検索：ラーメン選択連動 ---
        document.getElementById('search-genre').addEventListener('change', (e) => {
            const subField = document.getElementById('search-ramen-sub');
            if (e.target.value === 'ラーメン') {
                subField.style.display = 'block';
            } else {
                subField.style.display = 'none';
                document.getElementById('search-ramen-type').value = 'すべて';
            }
            filterPosts();
        });

        // --- データのリアルタイム取得 ---
        db.ref('posts').on('value', (snapshot) => {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            allPosts = [];
            
            if (!snapshot.exists()) {
                container.innerHTML = '<div class="no-data">条件に合う投稿がありません</div>';
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const post = childSnapshot.val();
                post.id = childSnapshot.key;
                allPosts.push(post);
            });

            filterPosts();
        });

        // --- 投稿一覧の描画関数 ---
        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<div class="no-data">条件に合う投稿がありません</div>';
                return;
            }

            const sorted = [...posts].reverse();

            sorted.forEach((post) => {
                const mapQuery = encodeURIComponent(`${post.state || ''}${post.city || ''} ${post.shopName}`);
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

                let badgesHtml = '';
                if (post.genre === 'ラーメン' && post.ramenType) badgesHtml += `<span class="badge" style="background:#ff5722; color:#fff;">🍜 ${escapeHtml(post.ramenType)}</span>`;
                if (post.holiday) badgesHtml += `<span class="badge">店休: ${escapeHtml(post.holiday)}</span>`;
                
                const vibes = Array.isArray(post.targetVibes) ? post.targetVibes : [];
                vibes.forEach(v => { badgesHtml += `<span class="badge">${escapeHtml(v)}</span>`; });

                if (post.parking && post.parking !== '不明・記載なし') badgesHtml += `<span class="badge">${escapeHtml(post.parking)}</span>`;
                
                const payments = Array.isArray(post.payments) ? post.payments : [];
                payments.forEach(p => { badgesHtml += `<span class="badge">${escapeHtml(p)}</span>`; });

                if (post.reservation && post.reservation !== '不明・記載なし') badgesHtml += `<span class="badge">${escapeHtml(post.reservation)}</span>`;

                let editButtonHtml = '';
                if (post.author === window.currentLiffName) {
                    editButtonHtml = `<button type="button" class="edit-btn" onclick="openEditModal('${post.id}')">✏️ 編集</button>`;
                }

                const div = document.createElement('div');
                div.className = 'post-item';
                div.innerHTML = `
                    <strong>${escapeHtml(post.shopName)}</strong> (${escapeHtml(post.genre)})<br>
                    <small>📍 ${escapeHtml(post.state || '')} ${escapeHtml(post.city || '')}</small>
                    <a href="${mapUrl}" target="_blank" style="font-size: 12px; color: #4fa3ff; margin-left: 8px; text-decoration: none;">🗺️ 地図アプリで開く</a><br>
                    
                    ${badgesHtml ? `<div class="tags-container">${badgesHtml}</div>` : ''}
                    ${post.comment ? `<p style="margin: 6px 0; color: #ddd;">${escapeHtml(post.comment)}</p>` : ''}
                    ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image" alt="投稿画像">` : ''}
                    
                    <div class="link-btns">
                        ${post.hpUrl ? `<a href="${escapeHtml(post.hpUrl)}" target="_blank">🌐 HPを見る</a>` : ''}
                        ${post.instaUrl ? `<a href="${escapeHtml(post.instaUrl)}" target="_blank">📷 Instagram</a>` : ''}
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
                        <small style="color: #a0a0a0;">投稿者: ${escapeHtml(post.author)}</small>
                        ${editButtonHtml}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // --- 編集モーダルを開く関数 ---
        window.openEditModal = function(id) {
            const post = allPosts.find(p => p.id === id);
            if (!post) return;

            document.getElementById('edit-id').value = post.id;
            document.getElementById('edit-genre').value = post.genre;
            
            const subField = document.getElementById('edit-ramen-sub');
            const ramenSelect = document.getElementById('edit-ramen-type');
            if (post.genre === 'ラーメン') {
                subField.style.display = 'block';
                ramenSelect.required = true;
                ramenSelect.value = post.ramenType || '';
            } else {
                subField.style.display = 'none';
                ramenSelect.required = false;
                ramenSelect.value = '';
            }

            document.getElementById('edit-shop-name').value = post.shopName || '';
            document.getElementById('edit-state').value = post.state || '';
            document.getElementById('edit-city').value = post.city || '';
            document.getElementById('edit-holiday').value = post.holiday || '';
            document.getElementById('edit-parking').value = post.parking || '不明・記載なし';
            document.getElementById('edit-reservation').value = post.reservation || '不明・記載なし';
            document.getElementById('edit-hp-url').value = post.hpUrl || '';
            document.getElementById('edit-insta-url').value = post.instaUrl || '';
            document.getElementById('edit-comment').value = post.comment || '';
            document.getElementById('edit-image-file').value = '';

            const vibes = Array.isArray(post.targetVibes) ? post.targetVibes : [];
            document.querySelectorAll('input[name="edit-targetVibe"]').forEach(cb => {
                cb.checked = vibes.includes(cb.value);
            });

            const payments = Array.isArray(post.payments) ? post.payments : [];
            document.querySelectorAll('input[name="edit-payment"]').forEach(cb => {
                cb.checked = payments.includes(cb.value);
            });

            document.getElementById('edit-modal').style.display = 'block';
        };

        document.getElementById('edit-cancel-btn').addEventListener('click', () => {
            document.getElementById('edit-modal').style.display = 'none';
        });

        // --- 編集内容の保存処理 ---
        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const genre = document.getElementById('edit-genre').value;
            const ramenType = genre === 'ラーメン' ? document.getElementById('edit-ramen-type').value : '';
            const shopName = document.getElementById('edit-shop-name').value;
            const state = document.getElementById('edit-state').value;
            const city = document.getElementById('edit-city').value;
            const holiday = document.getElementById('edit-holiday').value;
            
            const targetVibes = Array.from(document.querySelectorAll('input[name="edit-targetVibe"]:checked')).map(el => el.value);
            const parking = document.getElementById('edit-parking').value;
            const payments = Array.from(document.querySelectorAll('input[name="edit-payment"]:checked')).map(el => el.value);
            const reservation = document.getElementById('edit-reservation').value;
            const hpUrl = document.getElementById('edit-hp-url').value;
            const instaUrl = document.getElementById('edit-insta-url').value;
            const comment = document.getElementById('edit-comment').value;
            const imageFile = document.getElementById('edit-image-file').files[0];

            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'block';

            try {
                const post = allPosts.find(p => p.id === id);
                let imageUrl = post.imageUrl || "";

                if (imageFile) {
                    const compressedBlob = await compressImage(imageFile);
                    const storageRef = storage.ref();
                    const imageRef = storageRef.child('images/' + Date.now() + '_' + imageFile.name);
                    const snapshot = await imageRef.put(compressedBlob);
                    imageUrl = await snapshot.ref.getDownloadURL();
                }

                await db.ref('posts/' + id).update({
                    genre,
                    ramenType,
                    shopName,
                    state,
                    city,
                    holiday,
                    targetVibes,
                    parking,
                    payments,
                    reservation,
                    hpUrl,
                    instaUrl,
                    comment,
                    imageUrl
                });

                alert('編集を保存しました！');
                document.getElementById('edit-modal').style.display = 'none';
            } catch (error) {
                alert('エラーが発生しました: ' + error.message);
            } finally {
                loadingOverlay.style.display = 'none';
            }
        });

        // --- 検索・絞り込み機能 ---
        function filterPosts() {
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const searchCity = document.getElementById('search-city').value.toLowerCase();
            const genre = document.getElementById('search-genre').value;
            const ramenType = document.getElementById('search-ramen-type').value;

            const filtered = allPosts.filter(post => {
                const matchGenre = (genre === 'すべて' || post.genre === genre);
                
                let matchRamen = true;
                if (genre === 'ラーメン' && ramenType !== 'すべて') {
                    matchRamen = (post.ramenType === ramenType);
                }

                let matchCity = true;
                if (searchCity) {
                    const postCity = (post.city || '').toLowerCase();
                    matchCity = postCity.includes(searchCity);
                }

                const vibesStr = Array.isArray(post.targetVibes) ? post.targetVibes.join(' ') : '';
                const paymentsStr = Array.isArray(post.payments) ? post.payments.join(' ') : '';

                const text = `${post.shopName} ${post.genre} ${post.ramenType || ''} ${post.state} ${post.city} ${post.holiday} ${vibesStr} ${post.parking} ${paymentsStr} ${post.reservation} ${post.comment} ${post.author}`.toLowerCase();
                const matchKeyword = text.includes(keyword);

                return matchGenre && matchRamen && matchCity && matchKeyword;
            });

            renderPosts(filtered);
        }

        document.getElementById('search-keyword').addEventListener('input', filterPosts);
        document.getElementById('search-city').addEventListener('input', filterPosts);
        document.getElementById('search-ramen-type').addEventListener('change', filterPosts);

        // --- ルーレット機能（2段階） ---
        document.getElementById('roulette-genre-btn').addEventListener('click', () => {
            if (allPosts.length === 0) {
                document.getElementById('roulette-genre-result').innerText = '投稿がありません！';
                return;
            }
            const genres = [...new Set(allPosts.map(p => p.genre))];
            const randomGenre = genres[Math.floor(Math.random() * genres.length)];
            
            selectedGenreForRoulette = randomGenre;
            document.getElementById('roulette-genre-result').innerText = `🎯 ジャンルは【 ${randomGenre} 】に決定！`;
            document.getElementById('roulette-shop-result').innerText = '下のボタンを押してお店を決めよう！';
        });

        document.getElementById('roulette-shop-btn').addEventListener('click', () => {
            if (allPosts.length === 0) {
                document.getElementById('roulette-shop-result').innerText = '投稿がありません！';
                return;
            }

            let targetPosts = allPosts;
            if (selectedGenreForRoulette) {
                targetPosts = allPosts.filter(p => p.genre === selectedGenreForRoulette);
            }

            if (targetPosts.length === 0) {
                document.getElementById('roulette-shop-result').innerText = '該当するジャンルのお店がありません';
                return;
            }

            const picked = targetPosts[Math.floor(Math.random() * targetPosts.length)];
            document.getElementById('roulette-shop-result').innerText = `🎉 【 ${picked.shopName} 】 (${picked.genre}) に決定！`;
        });

        // --- 投稿フォーム送信処理 ---
        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const genre = document.getElementById('genre').value;
            const ramenType = genre === 'ラーメン' ? document.getElementById('ramen-type').value : '';
            const shopName = document.getElementById('shop-name').value;
            const state = document.getElementById('state').value;
            const city = document.getElementById('city').value;
            const holiday = document.getElementById('holiday').value;
            
            const targetVibes = Array.from(document.querySelectorAll('input[name="targetVibe"]:checked')).map(el => el.value);
            const parking = document.getElementById('parking').value;
            const payments = Array.from(document.querySelectorAll('input[name="payment"]:checked')).map(el => el.value);
            const reservation = document.getElementById('reservation').value;
            const hpUrl = document.getElementById('hp-url').value;
            const instaUrl = document.getElementById('insta-url').value;
            const comment = document.getElementById('comment').value;
            const author = document.getElementById('author').value || "ゲスト";
            const imageFile = document.getElementById('image-file').files[0];

            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'block';

            try {
                let imageUrl = "";

                if (imageFile) {
                    const compressedBlob = await compressImage(imageFile);
                    const storageRef = storage.ref();
                    const imageRef = storageRef.child('images/' + Date.now() + '_' + imageFile.name);
                    const snapshot = await imageRef.put(compressedBlob);
                    imageUrl = await snapshot.ref.getDownloadURL();
                }

                await db.ref('posts').push({
                    genre,
                    ramenType,
                    shopName,
                    state,
                    city,
                    holiday,
                    targetVibes,
                    parking,
                    payments,
                    reservation,
                    hpUrl,
                    instaUrl,
                    comment,
                    imageUrl,
                    author,
                    timestamp: Date.now()
                });

                alert('投稿しました！');
                document.getElementById('post-form').reset();
                document.getElementById('post-ramen-sub').style.display = 'none';
                if (window.currentLiffName) {
                    document.getElementById('author').value = window.currentLiffName;
                }
            } catch (error) {
                alert('エラーが発生しました: ' + error.message);
            } finally {
                loadingOverlay.style.display = 'none';
            }
        });

        // --- XSS対策のエスケープ関数 ---
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`<>]/g, function(match) {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '<': '&lt;',
                    '>': '&gt;',
                }[match];
            });
        }

        // --- LIFF初期化 ---
        document.addEventListener("DOMContentLoaded", () => {
            try {
                liff.init({ liffId: "2011348764-TFzS41F9" })
                    .then(() => {
                        if (liff.isLoggedIn()) {
                            liff.getProfile().then(profile => {
                                window.currentLiffName = profile.displayName;
                                const authorInput = document.getElementById('author');
                                if (authorInput) {
                                    authorInput.value = window.currentLiffName;
                                }
                                filterPosts();
                            }).catch(() => {});
                        }
                    })
                    .catch((err) => {
                        console.log("LIFF init error ignored: ", err);
                    });
            } catch (e) {
                console.log("LIFF not available");
            }
        });
    </script>
</body>
</html>
