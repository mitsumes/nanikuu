<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - グループ飲食店共有</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Firebase設定
        const firebaseConfig = {
            databaseURL: "https://nanikuu-default-rtdb.firebaseio.com/",
            projectId: "nanikuu",
            storageBucket: "nanikuu.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        let currentGroupId = "default_group";
        let allRestaurants = [];
        let currentUserName = "ゲスト";

        // DOM要素
        const restaurantListEl = document.getElementById("restaurant-list");
        const groupNameEl = document.getElementById("group-name");
        const loadingEl = document.getElementById("loading");
        const formEl = document.getElementById("restaurant-form");
        const submitBtn = document.getElementById("submit-btn");
        const cancelEditBtn = document.getElementById("cancel-edit");
        const editIdInput = document.getElementById("edit-id");
        const currentPhotoUrlInput = document.getElementById("current-photo-url");
        const currentPhotoPathInput = document.getElementById("current-photo-path");

        // 詳細モーダル要素
        const detailModal = document.getElementById("detail-modal");
        const detailImage = document.getElementById("detail-image");
        const detailName = document.getElementById("detail-name");
        const detailGenre = document.getElementById("detail-genre");
        const detailRegion = document.getElementById("detail-region");
        const detailMemo = document.getElementById("detail-memo");
        const detailAuthor = document.getElementById("detail-author");
        const closeDetailBtn = document.getElementById("close-detail");

        // 削除モーダル要素
        const deleteModal = document.getElementById("delete-modal");
        const confirmDeleteBtn = document.getElementById("confirm-delete");
        const cancelDeleteBtn = document.getElementById("cancel-delete");
        let targetDeleteId = null;
        let targetDeletePhotoPath = null;

        // 初期化処理（以前の確実に動いていたロジックに復元）
        async function initLiff() {
            try {
                await liff.init({ liffId: "2011348764-dl9CNIS4" });
                if (liff.isInClient()) {
                    const context = liff.getContext();
                    if (context && (context.groupId || context.roomId)) {
                        currentGroupId = context.groupId || context.roomId;
                        groupNameEl.textContent = "LINEグループ専用なにクウ？";
                    } else {
                        groupNameEl.textContent = "個人チャット（デフォルト）";
                    }
                    try {
                        const profile = await liff.getProfile();
                        currentUserName = profile.displayName;
                    } catch (e) {
                        console.log("プロフィール取得失敗", e);
                    }
                } else {
                    const urlParams = new URLSearchParams(window.location.search);
                    const groupParam = urlParams.get('group');
                    if (groupParam) {
                        currentGroupId = groupParam;
                    }
                    groupNameEl.textContent = "ブラウザテストモード (" + currentGroupId + ")";
                }
            } catch (error) {
                console.error("LIFF Initialization failed", error);
                groupNameEl.textContent = "通常ブラウザモード";
            }
            loadRestaurants();
        }

        // データの読み込み
        function loadRestaurants() {
            const sanitizedGroupId = currentGroupId.replace(/[.#$[\]]/g, "_");
            const dbRef = ref(db, 'groups/' + sanitizedGroupId + '/restaurants');
            
            onValue(dbRef, (snapshot) => {
                allRestaurants = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach((key) => {
                        allRestaurants.push({ id: key, ...data[key] });
                    });
                }
                renderRestaurants(allRestaurants);
                loadingEl.classList.add("hidden");
            }, (error) => {
                console.error("Data load failed", error);
                loadingEl.textContent = "データの読み込みに失敗しました。";
            });
        }

        // リストの描画
        function renderRestaurants(list) {
            restaurantListEl.innerHTML = "";
            if (list.length === 0) {
                restaurantListEl.innerHTML = `<div class=\"col-span-full text-center py-8 text-gray-500\">登録されているお店がありません。<br>下から追加してみよう！</div>`;
                return;
            }

            list.forEach((item) => {
                const card = document.createElement("div");
                card.className = "bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between border border-gray-100 hover:shadow-lg transition";
                
                const imageUrl = item.photoUrl || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=60";
                
                card.innerHTML = `
                    <div class=\"cursor-pointer\" onclick=\"openDetail('${item.id}')\">
                        <div class=\"h-40 overflow-hidden bg-gray-100 relative\">
                            <img src=\"${imageUrl}\" alt=\"${item.name}\" class=\"w-full h-full object-cover\">
                            <span class=\"absolute top-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded-full\">${item.genre || 'その他'}</span>
                        </div>
                        <div class=\"p-4\">
                            <h3 class=\"font-bold text-lg text-gray-800 truncate\">${item.name}</h3>
                            <p class=\"text-xs text-gray-500 mt-1\">📍 ${item.region || '未設定'}</p>
                        </div>
                    </div>
                    <div class=\"px-4 pb-4 pt-0 flex justify-end gap-2 border-t border-gray-50 pt-3\">
                        <button onclick=\"startEdit('${item.id}')\" class=\"text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg font-medium transition\">編集</button>
                        <button onclick=\"promptDelete('${item.id}', '${item.photoPath || ''}')\" class=\"text-xs bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg font-medium transition\">削除</button>
                    </div>
                `;
                restaurantListEl.appendChild(card);
            });
        }

        // 詳細モーダルを開く（投稿者名が表示される機能付き）
        window.openDetail = function(id) {
            const item = allRestaurants.find(r => r.id === id);
            if (!item) return;

            detailImage.src = item.photoUrl || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=60";
            detailName.textContent = item.name;
            detailGenre.textContent = item.genre || '未設定';
            detailRegion.textContent = item.region || '未設定';
            detailMemo.textContent = item.memo || 'メモなし';
            detailAuthor.textContent = item.authorName || '名無し';

            detailModal.classList.remove("hidden");
            detailModal.classList.add("flex");
        };

        closeDetailBtn.addEventListener("click", () => {
            detailModal.classList.add("hidden");
            detailModal.classList.remove("flex");
        });

        // フォーム送信処理（追加・編集）
        formEl.addEventListener("submit", async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "保存中...";

            const name = document.getElementById("restaurant-name").value;
            const genre = document.getElementById("restaurant-genre").value;
            const region = document.getElementById("restaurant-region").value;
            const memo = document.getElementById("restaurant-memo").value;
            const photoFile = document.getElementById("restaurant-photo").files[0];
            const editId = editIdInput.value;
            let photoUrl = currentPhotoUrlInput.value;
            let photoPath = currentPhotoPathInput.value;

            try {
                if (photoFile) {
                    if (photoPath) {
                        try {
                            const oldRef = storageRef(storage, photoPath);
                            await deleteObject(oldRef);
                        } catch (err) {
                            console.log("古い画像の削除に失敗または存在しません", err);
                        }
                    }
                    const newPhotoPath = `images/${currentGroupId}/${Date.now()}_${photoFile.name}`;
                    const fileRef = storageRef(storage, newPhotoPath);
                    const snapshot = await uploadBytes(fileRef, photoFile);
                    photoUrl = await getDownloadURL(snapshot.ref);
                    photoPath = newPhotoPath;
                }

                const sanitizedGroupId = currentGroupId.replace(/[.#$[\]]/g, "_");
                const dbRef = ref(db, `groups/${sanitizedGroupId}/restaurants`);
                
                if (editId) {
                    const updateRef = ref(db, `groups/${sanitizedGroupId}/restaurants/${editId}`);
                    await update(updateRef, {
                        name, genre, region, memo, photoUrl, photoPath,
                        updatedAt: Date.now()
                    });
                } else {
                    const newRef = push(dbRef);
                    await set(newRef, {
                        name, genre, region, memo, photoUrl, photoPath,
                        authorName: currentUserName,
                        createdAt: Date.now()
                    });
                }

                formEl.reset();
                resetFormState();
            } catch (error) {
                console.error("保存エラー:", error);
                alert("保存に失敗しました。もう一度お試しください。");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = editId ? "更新する" : "登録する";
            }
        });

        // 編集モード開始
        window.startEdit = function(id) {
            const item = allRestaurants.find(r => r.id === id);
            if (!item) return;

            editIdInput.value = item.id;
            document.getElementById("restaurant-name").value = item.name;
            document.getElementById("restaurant-genre").value = item.genre || "";
            document.getElementById("restaurant-region").value = item.region || "";
            document.getElementById("restaurant-memo").value = item.memo || "";
            currentPhotoUrlInput.value = item.photoUrl || "";
            currentPhotoPathInput.value = item.photoPath || "";

            submitBtn.textContent = "更新する";
            cancelEditBtn.classList.remove("hidden");
            formEl.scrollIntoView({ behavior: 'smooth' });
        };

        // 編集キャンセル
        cancelEditBtn.addEventListener("click", () => {
            formEl.reset();
            resetFormState();
        });

        function resetFormState() {
            editIdInput.value = "";
            currentPhotoUrlInput.value = "";
            currentPhotoPathInput.value = "";
            submitBtn.textContent = "登録する";
            cancelEditBtn.classList.add("hidden");
        }

        // 削除確認モーダルを開く
        window.promptDelete = function(id, path) {
            targetDeleteId = id;
            targetDeletePhotoPath = path;
            deleteModal.classList.remove("hidden");
            deleteModal.classList.add("flex");
        };

        cancelDeleteBtn.addEventListener("click", () => {
            deleteModal.classList.add("hidden");
            deleteModal.classList.remove("flex");
            targetDeleteId = null;
            targetDeletePhotoPath = null;
        });

        confirmDeleteBtn.addEventListener("click", async () => {
            if (!targetDeleteId) return;

            try {
                if (targetDeletePhotoPath) {
                    try {
                        const fileRef = storageRef(storage, targetDeletePhotoPath);
                        await deleteObject(fileRef);
                    } catch (err) {
                        console.log("画像ファイルの削除に失敗または存在しません", err);
                    }
                }

                const sanitizedGroupId = currentGroupId.replace(/[.#$[\]]/g, "_");
                const itemRef = ref(db, `groups/${sanitizedGroupId}/restaurants/${targetDeleteId}`);
                await remove(itemRef);

                deleteModal.classList.add("hidden");
                deleteModal.classList.remove("flex");
                targetDeleteId = null;
                targetDeletePhotoPath = null;
            } catch (error) {
                console.error("削除エラー:", error);
                alert("削除に失敗しました。");
            }
        });

        // ルーレット機能
        const rouletteBtn = document.getElementById("roulette-btn");
        const rouletteModal = document.getElementById("roulette-modal");
        const startRouletteBtn = document.getElementById("start-roulette");
        const closeRouletteBtn = document.getElementById("close-roulette");
        const rouletteResult = document.getElementById("roulette-result");

        rouletteBtn.addEventListener("click", () => {
            if (allRestaurants.length === 0) {
                alert("お店が登録されていません！");
                return;
            }
            rouletteResult.innerHTML = "<p class='text-gray-500'>ボタンを押して抽選スタート！</p>";
            rouletteModal.classList.remove("hidden");
            rouletteModal.classList.add("flex");
        });

        closeRouletteBtn.addEventListener("click", () => {
            rouletteModal.classList.add("hidden");
            rouletteModal.classList.remove("flex");
        });

        startRouletteBtn.addEventListener("click", () => {
            if (allRestaurants.length === 0) return;
            
            let count = 0;
            startRouletteBtn.disabled = true;
            
            const timer = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * allRestaurants.length);
                const pick = allRestaurants[randomIndex];
                rouletteResult.innerHTML = `
                    <div class=\"animate-pulse\">
                        <h4 class=\"text-xl font-bold text-orange-600\">${pick.name}</h4>
                        <p class=\"text-sm text-gray-500 mt-1\">${pick.genre || 'その他'} / ${pick.region || '未設定'}</p>
                    </div>
                `;
                count++;
                if (count > 15) {
                    clearInterval(timer);
                    const finalPick = allRestaurants[Math.floor(Math.random() * allRestaurants.length)];
                    rouletteResult.innerHTML = `
                        <div class=\"bg-orange-50 border border-orange-200 p-4 rounded-xl\">
                            <span class=\"text-xs bg-orange-500 text-white px-2 py-0.5 rounded-full font-bold\">決定！🎉</span>
                            <h4 class=\"text-2xl font-black text-gray-800 mt-2\">${finalPick.name}</h4>
                            <p class=\"text-sm text-gray-600 mt-1\">📍 ${finalPick.region || '未設定'} | 🍽️ ${finalPick.genre || 'その他'}</p>
                            <p class=\"text-xs text-gray-500 mt-2\">メモ: ${finalPick.memo || 'なし'}</p>
                        </div>
                    `;
                    startRouletteBtn.disabled = false;
                }
            }, 100);
        });

        window.addEventListener("DOMContentLoaded", initLiff);
    </script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-20">

    <!-- ヘッダー -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-black text-orange-500 tracking-wider">🍽️ なにクウ？</h1>
            <span id="group-name" class="text-xs bg-orange-100 text-orange-700 font-medium px-2.5 py-1 rounded-full truncate max-w-[150px]">読み込み中...</span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md mx-auto px-4 py-4 space-y-6">

        <!-- アクションボタンエリア -->
        <div class="flex gap-3">
            <button id="roulette-btn" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:opacity-95 transition text-center flex items-center justify-center gap-2">
                <span>🎰</span> お店ルーレット
            </button>
        </div>

        <!-- お店リスト -->
        <section>
            <h2 class="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wider">登録されたお店一覧</h2>
            <div id="loading" class="text-center py-8 text-gray-400">読み込み中...</div>
            <div id="restaurant-list" class="grid grid-cols-1 gap-4">
                <!-- 動的生成 -->
            </div>
        </section>

        <!-- 投稿・編集フォーム -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-base font-bold text-gray-800 mb-4 pb-2 border-b border-gray-100">お店を登録・編集する</h2>
            <form id="restaurant-form" class="space-y-4">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="current-photo-url">
                <input type="hidden" id="current-photo-path">

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">店名 <span class="text-red-500">*</span></label>
                    <input type="text" id="restaurant-name" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">ジャンル</label>
                        <input type="text" id="restaurant-genre" placeholder="例: 居酒屋、ラーメン" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">エリア</label>
                        <input type="text" id="restaurant-region" placeholder="例: 名駅、栄" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">写真</label>
                    <input type="file" id="restaurant-photo" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">メモ・おすすめポイント</label>
                    <textarea id="restaurant-memo" rows="2" placeholder="例: 個室あり、唐揚げが美味しい" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"></textarea>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="submit-btn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 px-4 rounded-xl text-sm shadow transition">登録する</button>
                    <button type="button" id="cancel-edit" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-xl text-sm transition">キャンセル</button>
                </div>
            </form>
        </section>

    </main>

    <!-- 詳細モーダル -->
    <div id="detail-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl animate-scaleIn">
            <div class="h-48 bg-gray-100 relative">
                <img id="detail-image" src="" alt="" class="w-full h-full object-cover">
            </div>
            <div class="p-5 space-y-3">
                <div>
                    <span id="detail-genre" class="text-xs bg-orange-100 text-orange-700 px-2.5 py-1 rounded-full font-medium"></span>
                    <h3 id="detail-name" class="text-xl font-bold text-gray-800 mt-2"></h3>
                </div>
                <div class="text-xs text-gray-600 space-y-1">
                    <p>📍 エリア: <span id="detail-region" class="font-medium text-gray-800"></span></p>
                    <p>👤 投稿者: <span id="detail-author" class="font-medium text-gray-800"></span></p>
                </div>
                <div class="bg-gray-50 p-3 rounded-xl">
                    <p class="text-xs font-bold text-gray-500 mb-1">メモ</p>
                    <p id="detail-memo" class="text-sm text-gray-700 whitespace-pre-wrap"></p>
                </div>
                <button id="close-detail" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-sm transition mt-2">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="delete-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-xs w-full p-5 text-center shadow-2xl space-y-4">
            <div class="text-3xl">⚠️</div>
            <h3 class="font-bold text-gray-800 text-base">本当に削除しますか？</h3>
            <p class="text-xs text-gray-500">この操作は元に戻すことはできません。</p>
            <div class="flex gap-2 pt-2">
                <button id="cancel-delete" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-sm transition">いいえ</button>
                <button id="confirm-delete" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2.5 rounded-xl text-sm transition">削除する</button>
            </div>
        </div>
    </div>

    <!-- ルーレット結果モーダル -->
    <div id="roulette-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 text-center shadow-2xl space-y-4">
            <h3 class="font-black text-lg text-gray-800">🎰 お店ルーレット</h3>
            <div id="roulette-result" class="py-6 min-h-[100px] flex items-center justify-center">
                <p class="text-gray-500 text-sm">ボタンを押して抽選スタート！</p>
            </div>
            <div class="space-y-2">
                <button id="start-roulette" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:opacity-95 text-white font-bold py-3 rounded-xl text-sm shadow transition">スタート！</button>
                <button id="close-roulette" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-sm transition">閉じる</button>
            </div>
        </div>
    </div>

</body>
</html>
