    <script>
        // --- Firebaseの設定 ---
        const firebaseConfig = {
            databaseURL: "https://nanikuu-default-rtdb.firebaseio.com/",
            storageBucket: "nanikuu.firebasestorage.app"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const storage = firebase.storage();

        let allPosts = [];
        let selectedGenreForRoulette = "";
        window.currentLiffName = "ゲスト";
        let currentGroupId = "";

        // --- 画像圧縮関数 ---
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', 0.7);
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // --- LIFF初期化 & グループID取得・制限 ---
        async function initializeLiff() {
            try {
                if (typeof liff !== 'undefined') {
                    await liff.init({ liffId: "2011348764-TFzS41F9" });

                    const context = liff.getContext();
                    if (!context || (context.type !== 'group' && context.type !== 'room')) {
                        document.getElementById('error-screen').style.display = 'flex';
                        return;
                    }

                    currentGroupId = context.groupId || context.roomId;

                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        window.currentLiffName = profile.displayName;
                        document.getElementById('author').value = window.currentLiffName;
                    } else {
                        liff.login();
                    }

                    // グループのデータ（投稿＆グループ名）を監視開始
                    setupDatabaseListeners();
                }
            } catch (error) {
                console.error("LIFF initialization failed", error);
            }
        }

        // --- データベース監視（投稿一覧 ＆ グループ名） ---
        function setupDatabaseListeners() {
            if (!currentGroupId) return;

            // グループ名の監視
            db.ref('groups/' + currentGroupId + '/groupName').on('value', (snapshot) => {
                const name = snapshot.val();
                const nameEl = document.getElementById('group-name-text');
                if (name) {
                    nameEl.textContent = name;
                } else {
                    nameEl.textContent = 'マイグループ（未設定）';
                }
            });

            // 投稿一覧の監視
            db.ref('groups/' + currentGroupId + '/posts').on('value', (snapshot) => {
                const data = snapshot.val();
                allPosts = [];

                if (data) {
                    Object.keys(data).forEach((key) => {
                        allPosts.push({ id: key, ...data[key] });
                    });
                    allPosts.sort((a, b) => b.createdAt - a.createdAt);
                }
                filterPosts();
            });
        }

        // --- グループ名の編集関数 ---
        window.editGroupName = async function() {
            if (!currentGroupId) return;
            const currentName = document.getElementById('group-name-text').textContent;
            const newName = prompt('新しいグループ名を入力してください:', currentName === 'マイグループ（未設定）' ? '' : currentName);
            
            if (newName !== null && newName.trim() !== '') {
                try {
                    await db.ref('groups/' + currentGroupId).update({
                        groupName: newName.trim()
                    });
                    alert('グループ名を更新しました！');
                } catch (error) {
                    console.error(error);
                    alert('グループ名の更新に失敗しました: ' + error.message);
                }
            }
        };

        // --- ジャンル選択によるラーメンサブ項目の切り替え ---
        document.getElementById('genre').addEventListener('change', (e) => {
            const sub = document.getElementById('post-ramen-sub');
            if (e.target.value === 'ラーメン') {
                sub.style.display = 'block';
                document.getElementById('ramen-type').required = true;
            } else {
                sub.style.display = 'none';
                document.getElementById('ramen-type').required = false;
                document.getElementById('ramen-type').value = '';
            }
        });

        document.getElementById('edit-genre').addEventListener('change', (e) => {
            const sub = document.getElementById('edit-ramen-sub');
            if (e.target.value === 'ラーメン') {
                sub.style.display = 'block';
                document.getElementById('edit-ramen-type').required = true;
            } else {
                sub.style.display = 'none';
                document.getElementById('edit-ramen-type').required = false;
                document.getElementById('edit-ramen-type').value = '';
            }
        });

        document.getElementById('search-genre').addEventListener('change', (e) => {
            const sub = document.getElementById('search-ramen-sub');
            if (e.target.value === 'ラーメン') {
                sub.style.display = 'block';
            } else {
                sub.style.display = 'none';
                document.getElementById('search-ramen-type').value = 'すべて';
            }
            filterPosts();
        });

        // --- 検索フィルターのイベント ---
        document.getElementById('search-keyword').addEventListener('input', filterPosts);
        document.getElementById('search-city').addEventListener('input', filterPosts);
        document.getElementById('search-ramen-type').addEventListener('change', filterPosts);

        // --- 投稿処理 ---
        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentGroupId) {
                alert('グループIDが取得できませんでした。');
                return;
            }

            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'block';

            try {
                const genre = document.getElementById('genre').value;
                const ramenType = genre === 'ラーメン' ? document.getElementById('ramen-type').value : '';
                const shopName = document.getElementById('shop-name').value;
                const state = document.getElementById('state').value;
                const city = document.getElementById('city').value;
                const holiday = document.getElementById('holiday').value;
                
                const targetVibe = Array.from(document.querySelectorAll('input[name="targetVibe"]:checked')).map(el => el.value);
                const parking = document.getElementById('parking').value;
                const payment = Array.from(document.querySelectorAll('input[name="payment"]:checked')).map(el => el.value);
                const reservation = document.getElementById('reservation').value;
                
                const hpUrl = document.getElementById('hp-url').value;
                const instaUrl = document.getElementById('insta-url').value;
                const comment = document.getElementById('comment').value;
                const author = document.getElementById('author').value || window.currentLiffName;

                const imageFile = document.getElementById('image-file').files[0];
                let imageUrl = '';

                if (imageFile) {
                    const compressedBlob = await compressImage(imageFile);
                    const storageRef = storage.ref().child('images/' + currentGroupId + '/' + Date.now() + '_' + imageFile.name);
                    const snapshot = await storageRef.put(compressedBlob);
                    imageUrl = await snapshot.ref.getDownloadURL();
                }

                const newPostRef = db.ref('groups/' + currentGroupId + '/posts').push();
                await newPostRef.set({
                    genre,
                    ramenType,
                    shopName,
                    state,
                    city,
                    holiday,
                    targetVibe,
                    parking,
                    payment,
                    reservation,
                    hpUrl,
                    instaUrl,
                    comment,
                    imageUrl,
                    author,
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });

                alert('お店を投稿しました！');
                document.getElementById('post-form').reset();
                document.getElementById('post-ramen-sub').style.display = 'none';
                document.getElementById('author').value = window.currentLiffName;
            } catch (error) {
                console.error(error);
                alert('投稿に失敗しました: ' + error.message);
            } finally {
                loadingOverlay.style.display = 'none';
            }
        });

        function filterPosts() {
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const searchCity = document.getElementById('search-city').value.toLowerCase();
            const searchGenre = document.getElementById('search-genre').value;
            const searchRamenType = document.getElementById('search-ramen-type').value;

            const filtered = allPosts.filter(post => {
                const matchGenre = (searchGenre === 'すべて' || post.genre === searchGenre);
                const matchRamen = (searchGenre !== 'ラーメン' || searchRamenType === 'すべて' || post.ramenType === searchRamenType);
                const matchCity = (!searchCity || (post.city && post.city.toLowerCase().includes(searchCity)) || (post.state && post.state.toLowerCase().includes(searchCity)));
                
                const targetText = `${post.shopName} ${post.city} ${post.state} ${post.comment} ${post.genre} ${post.ramenType || ''}`.toLowerCase();
                const matchKeyword = (!keyword || targetText.includes(keyword));

                return matchGenre && matchRamen && matchCity && matchKeyword;
            });

            renderPosts(filtered);
        }

        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<div class="no-data">条件に合う投稿がありません</div>';
                return;
            }

            posts.forEach((post) => {
                const div = document.createElement('div');
                div.className = 'post-item';

                let tagsHtml = '';
                if (post.targetVibe) post.targetVibe.forEach(v => tagsHtml += `<span class="badge">${v}</span>`);
                if (post.parking && post.parking !== '不明・記載なし') tagsHtml += `<span class="badge">${post.parking}</span>`;
                if (post.payment) post.payment.forEach(p => tagsHtml += `<span class="badge">${p}</span>`);
                if (post.reservation && post.reservation !== '不明・記載なし') tagsHtml += `<span class="badge">${post.reservation}</span>`;

                let linksHtml = '';
                if (post.hpUrl || post.instaUrl) {
                    linksHtml += '<div class="link-btns">';
                    if (post.hpUrl) linksHtml += `<a href="${post.hpUrl}" target="_blank">🌐 HPを見る</a>`;
                    if (post.instaUrl) linksHtml += `<a href="${post.instaUrl}" target="_blank">📸 Instagram</a>`;
                    linksHtml += '</div>';
                }

                let genreDisplay = post.genre;
                if (post.genre === 'ラーメン' && post.ramenType) {
                    genreDisplay += ` (${post.ramenType})`;
                }

                const isAuthor = (post.author && post.author === window.currentLiffName);
                let actionBtnsHtml = '';
                if (isAuthor) {
                    actionBtnsHtml = `
                        <div class="action-btns">
                            <button class="edit-btn" onclick="openEditModal('${post.id}')">✏️ 編集</button>
                            <button class="delete-btn" onclick="deletePost('${post.id}', '${post.imageUrl || ''}')">🗑️ 削除</button>
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div style="font-size: 14px; color: var(--accent-color); font-weight: bold;">${genreDisplay}</div>
                    <div style="font-size: 18px; font-weight: bold; margin: 4px 0;">${post.shopName}</div>
                    <div style="font-size: 13px; color: var(--sub-text);">📍 ${post.state || ''} ${post.city || ''}</div>
                    ${post.holiday ? `<div style="font-size: 12px; color: var(--sub-text);">定休日: ${post.holiday}</div>` : ''}
                    <div class="tags-container">${tagsHtml}</div>
                    ${post.comment ? `<div style="font-size: 14px; margin: 8px 0; white-space: pre-wrap;">${post.comment}</div>` : ''}
                    ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image" alt="お店の写真">` : ''}
                    ${linksHtml}
                    <div style="font-size: 11px; color: var(--sub-text); margin-top: 8px;">投稿者: ${post.author || 'ゲスト'}</div>
                    ${actionBtnsHtml}
                `;
                container.appendChild(div);
            });
        }

        // --- 削除処理 ---
        window.deletePost = async function(id, imageUrl) {
            const post = allPosts.find(p => p.id === id);
            if (!post || post.author !== window.currentLiffName) {
                alert('ご自身の投稿のみ削除できます。');
                return;
            }
            if (!confirm('本当にこの投稿を削除しますか？')) return;
            try {
                await db.ref('groups/' + currentGroupId + '/posts/' + id).remove();
                if (imageUrl) {
                    try {
                        const imageRef = storage.refFromURL(imageUrl);
                        await imageRef.delete();
                    } catch (err) {
                        console.error("画像ファイルの削除に失敗しました", err);
                    }
                }
                alert('投稿を削除しました');
            } catch (error) {
                console.error(error);
                alert('削除に失敗しました: ' + error.message);
            }
        };

        // --- 編集モーダルを開く ---
        window.openEditModal = function(id) {
            const post = allPosts.find(p => p.id === id);
            if (!post || post.author !== window.currentLiffName) {
                alert('ご自身の投稿のみ編集できます。');
                return;
            }

            document.getElementById('edit-id').value = post.id;
            document.getElementById('edit-genre').value = post.genre || '';
            
            const editRamenSub = document.getElementById('edit-ramen-sub');
            if (post.genre === 'ラーメン') {
                editRamenSub.style.display = 'block';
                document.getElementById('edit-ramen-type').value = post.ramenType || '';
                document.getElementById('edit-ramen-type').required = true;
            } else {
                editRamenSub.style.display = 'none';
                document.getElementById('edit-ramen-type').value = '';
                document.getElementById('edit-ramen-type').required = false;
            }

            document.getElementById('edit-shop-name').value = post.shopName || '';
            document.getElementById('edit-state').value = post.state || '';
            document.getElementById('edit-city').value = post.city || '';
            document.getElementById('edit-holiday').value = post.holiday || '';

            document.querySelectorAll('input[name="edit-targetVibe"]').forEach(el => {
                el.checked = post.targetVibe && post.targetVibe.includes(el.value);
            });
            document.getElementById('edit-parking').value = post.parking || '不明・記載なし';
            document.querySelectorAll('input[name="edit-payment"]').forEach(el => {
                el.checked = post.payment && post.payment.includes(el.value);
            });
            document.getElementById('edit-reservation').value = post.reservation || '不明・記載なし';

            document.getElementById('edit-hp-url').value = post.hpUrl || '';
            document.getElementById('edit-insta-url').value = post.instaUrl || '';
            document.getElementById('edit-comment').value = post.comment || '';
            document.getElementById('edit-image-file').value = '';

            document.getElementById('edit-modal').style.display = 'block';
        };

        document.getElementById('edit-cancel-btn').addEventListener('click', () => {
            document.getElementById('edit-modal').style.display = 'none';
        });

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const post = allPosts.find(p => p.id === id);
            if (!post || post.author !== window.currentLiffName) {
                alert('ご自身の投稿のみ編集できます。');
                return;
            }

            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'block';

            try {
                const genre = document.getElementById('edit-genre').value;
                const ramenType = genre === 'ラーメン' ? document.getElementById('edit-ramen-type').value : '';
                const shopName = document.getElementById('edit-shop-name').value;
                const state = document.getElementById('edit-state').value;
                const city = document.getElementById('edit-city').value;
                const holiday = document.getElementById('edit-holiday').value;
                
                const targetVibe = Array.from(document.querySelectorAll('input[name="edit-targetVibe"]:checked')).map(el => el.value);
                const parking = document.getElementById('edit-parking').value;
                const payment = Array.from(document.querySelectorAll('input[name="edit-payment"]:checked')).map(el => el.value);
                const reservation = document.getElementById('edit-reservation').value;
                
                const hpUrl = document.getElementById('edit-hp-url').value;
                const instaUrl = document.getElementById('edit-insta-url').value;
                const comment = document.getElementById('edit-comment').value;

                let imageUrl = post.imageUrl || '';

                const imageFile = document.getElementById('edit-image-file').files[0];
                if (imageFile) {
                    const compressedBlob = await compressImage(imageFile);
                    const storageRef = storage.ref().child('images/' + currentGroupId + '/' + Date.now() + '_' + imageFile.name);
                    const snapshot = await storageRef.put(compressedBlob);
                    imageUrl = await snapshot.ref.getDownloadURL();
                }

                await db.ref('groups/' + currentGroupId + '/posts/' + id).update({
                    genre,
                    ramenType,
                    shopName,
                    state,
                    city,
                    holiday,
                    targetVibe,
                    parking,
                    payment,
                    reservation,
                    hpUrl,
                    instaUrl,
                    comment,
                    imageUrl
                });

                alert('投稿を更新しました！');
                document.getElementById('edit-modal').style.display = 'none';
            } catch (error) {
                console.error(error);
                alert('更新に失敗しました: ' + error.message);
            } finally {
                loadingOverlay.style.display = 'none';
            }
        });

        // --- ルーレット機能 ---
        document.getElementById('roulette-genre-btn').addEventListener('click', () => {
            const genres = [...new Set(allPosts.map(p => p.genre))];
            const resultEl = document.getElementById('roulette-genre-result');
            if (genres.length === 0) {
                resultEl.textContent = '投稿がありません';
                return;
            }
            let count = 0;
            const interval = setInterval(() => {
                const randomGenre = genres[Math.floor(Math.random() * genres.length)];
                resultEl.textContent = randomGenre;
                count++;
                if (count > 10) {
                    clearInterval(interval);
                    selectedGenreForRoulette = resultEl.textContent;
                }
            }, 100);
        });

        document.getElementById('roulette-shop-btn').addEventListener('click', () => {
            const resultEl = document.getElementById('roulette-shop-result');
            if (!selectedGenreForRoulette) {
                resultEl.textContent = '先にジャンルを決めてください！';
                return;
            }
            const targetPosts = allPosts.filter(p => p.genre === selectedGenreForRoulette);
            if (targetPosts.length === 0) {
                resultEl.textContent = '該当するお店がありません';
                return;
            }
            let count = 0;
            const interval = setInterval(() => {
                const randomShop = targetPosts[Math.floor(Math.random() * targetPosts.length)];
                resultEl.textContent = randomShop.shopName + ' (' + randomShop.city + ')';
                count++;
                if (count > 10) {
                    clearInterval(interval);
                }
            }, 100);
        });

        window.addEventListener('DOMContentLoaded', () => {
            initializeLiff();
        });
    </script>
</body>
</html>
