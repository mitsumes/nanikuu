<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？</title>
    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --sub-text: #a0a0a0;
            --accent-color: #ff5722;
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            color: var(--accent-color);
            margin: 0 0 8px 0;
            font-size: 28px;
        }
        p {
            color: var(--sub-text);
            margin: 0;
            font-size: 14px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        h2 {
            font-size: 16px;
            margin: 0 0 12px 0;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background-color: #2c2c2c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            opacity: 0.8;
        }
        .post-item {
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
        }
        .post-item:last-child {
            border-bottom: none;
        }
        .post-image {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
        }
        .no-data {
            text-align: center;
            color: var(--sub-text);
            padding: 12px;
            font-size: 14px;
        }
        #roulette-result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 12px;
        }
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            color: white;
            text-align: center;
            padding-top: 50vh;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">画像をアップロード中...</div>

    <div class="container">
        <header>
            <h1>なにクウ？</h1>
            <p>ご飯迷った時の決定＆写真共有アプリ</p>
        </header>

        <!-- 1. みんなの投稿一覧（一番上） -->
        <div class="card">
            <h2>🍴 みんなの投稿一覧</h2>
            <div id="posts-container">
                <div class="no-data">条件に合う投稿がありません</div>
            </div>
        </div>

        <!-- お店を探す・絞り込む -->
        <div class="card">
            <h2>🔍 お店を探す・絞り込む</h2>
            <input type="text" id="search-keyword" placeholder="検索ワード（例：ラーメン、おしゃれ）">
            <select id="search-genre">
                <option value="すべて">すべて</option>
                <option value="和食">和食</option>
                <option value="洋食">洋食</option>
                <option value="中華">中華</option>
                <option value="定食屋">定食屋</option>
                <option value="ファミレス">ファミレス</option>
                <option value="ラーメン">ラーメン</option>
                <option value="焼肉">焼肉</option>
            </select>
        </div>

        <!-- 投稿フォーム -->
        <div class="card">
            <h2>✏️ お店を投稿する</h2>
            <form id="post-form">
                <input type="text" id="shop-name" placeholder="店名 *" required>
                <select id="genre" required>
                    <option value="">ジャンルを選択 *</option>
                    <option value="和食">和食</option>
                    <option value="洋食">洋食</option>
                    <option value="中華">中華</option>
                    <option value="定食屋">定食屋</option>
                    <option value="ファミレス">ファミレス</option>
                    <option value="ラーメン">ラーメン</option>
                    <option value="焼肉">焼肉</option>
                </select>
                <input type="text" id="country" placeholder="国（例：日本）">
                <input type="text" id="state" placeholder="県名（例：愛知県）">
                <input type="text" id="city" placeholder="市名（例：東海市）">
                <input type="text" id="address" placeholder="詳細住所">
                <textarea id="comment" placeholder="コメント・おすすめメニューなど" rows="3"></textarea>
                <label style="font-size: 12px; color: #a0a0a0; display: block; margin-bottom: 4px;">お店の写真（1枚）</label>
                <input type="file" id="image-file" accept="image/*">
                <input type="text" id="author" placeholder="投稿者名（自動取得）" readonly>
                <button type="submit">投稿する</button>
            </form>
        </div>

        <!-- 2. ルーレット機能（一番下） -->
        <div class="card">
            <h2>🎰 ご飯決めルーレット</h2>
            <button id="roulette-btn" type="button">今日のゴハンを決定する！</button>
            <div id="roulette-result">ボタンを押してね！</div>
        </div>
    </div>

    <script>
        // --- Firebaseの設定 ---
        const firebaseConfig = {
            databaseURL: "https://nanikuu-default-rtdb.firebaseio.com/",
            storageBucket: "nanikuu.appspot.com"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const storage = firebase.storage();

        let allPosts = [];

        // --- データのリアルタイム取得 ---
        db.ref('posts').on('value', (snapshot) => {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            allPosts = [];
            
            if (!snapshot.exists()) {
                container.innerHTML = '<div class="no-data">条件に合う投稿がありません</div>';
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const post = childSnapshot.val();
                post.id = childSnapshot.key;
                allPosts.push(post);
            });

            renderPosts(allPosts);
        });

        // --- 投稿一覧の描画関数 ---
        function renderPosts(posts) {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<div class="no-data">条件に合う投稿がありません</div>';
                return;
            }

            const sorted = [...posts].reverse();

            sorted.forEach((post) => {
                const div = document.createElement('div');
                div.className = 'post-item';
                div.innerHTML = `
                    <strong>${escapeHtml(post.shopName)}</strong> (${escapeHtml(post.genre)})<br>
                    <small>📍 ${escapeHtml(post.state || '')} ${escapeHtml(post.city || '')} ${escapeHtml(post.address || '')}</small><br>
                    ${post.comment ? `<p style="margin: 4px 0; color: #ddd;">${escapeHtml(post.comment)}</p>` : ''}
                    ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image" alt="投稿画像">` : ''}
                    <small style="color: #a0a0a0; display: block; margin-top: 4px;">投稿者: ${escapeHtml(post.author)}</small>
                `;
                container.appendChild(div);
            });
        }

        // --- 検索・絞り込み機能 ---
        function filterPosts() {
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            const genre = document.getElementById('search-genre').value;

            const filtered = allPosts.filter(post => {
                const matchGenre = (genre === 'all' || genre === 'すべて' || post.genre === genre);
                const text = `${post.shopName} ${post.genre} ${post.state} ${post.city} ${post.address} ${post.comment} ${post.author}`.toLowerCase();
                const matchKeyword = text.includes(keyword);
                return matchGenre && matchKeyword;
            });

            renderPosts(filtered);
        }

        document.getElementById('search-keyword').addEventListener('input', filterPosts);
        document.getElementById('search-genre').addEventListener('change', filterPosts);

        // --- ルーレット機能 ---
        document.getElementById('roulette-btn').addEventListener('click', () => {
            if (allPosts.length === 0) {
                document.getElementById('roulette-result').innerText = '投稿がまだありません！';
                return;
            }
            const randomIndex = Math.floor(Math.random() * allPosts.length);
            const picked = allPosts[randomIndex];
            document.getElementById('roulette-result').innerText = `🎉 ${picked.shopName} (${picked.genre}) に決定！`;
        });

        // --- 投稿フォーム送信処理（画像アップロード対応） ---
        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const shopName = document.getElementById('shop-name').value;
            const genre = document.getElementById('genre').value;
            const country = document.getElementById('country').value;
            const state = document.getElementById('state').value;
            const city = document.getElementById('city').value;
            const address = document.getElementById('address').value;
            const comment = document.getElementById('comment').value;
            const author = document.getElementById('author').value || "ゲスト";
            const imageFile = document.getElementById('image-file').files[0];

            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.style.display = 'block';

            try {
                let imageUrl = "";

                if (imageFile) {
                    const storageRef = storage.ref();
                    const imageRef = storageRef.child('images/' + Date.now() + '_' + imageFile.name);
                    const snapshot = await imageRef.put(imageFile);
                    imageUrl = await snapshot.ref.getDownloadURL();
                }

                await db.ref('posts').push({
                    shopName,
                    genre,
                    country,
                    state,
                    city,
                    address,
                    comment,
                    imageUrl,
                    author,
                    timestamp: Date.now()
                });

                alert('投稿しました！');
                document.getElementById('post-form').reset();
                if (window.currentLiffName) {
                    document.getElementById('author').value = window.currentLiffName;
                }
            } catch (error) {
                alert('エラーが発生しました: ' + error.message);
            } finally {
                loadingOverlay.style.display = 'none';
            }
        });

        // --- XSS対策のエスケープ関数 ---
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`<>]/g, function(match) {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '<': '&lt;',
                    '>': '&gt;',
                }[match];
            });
        }

        // --- LIFF初期化 ＆ セキュリティガード ---
        window.currentLiffName = "ゲスト";
        document.addEventListener("DOMContentLoaded", () => {
            try {
                liff.init({ liffId: "2011348764-TFzS41F9" })
                    .then(() => {
                        if (liff.isLoggedIn()) {
                            liff.getProfile().then(profile => {
                                window.currentLiffName = profile.displayName;
                                const authorInput = document.getElementById('author');
                                if (authorInput) {
                                    authorInput.value = window.currentLiffName;
                                }
                            }).catch(() => {});
                        }
                    })
                    .catch((err) => {
                        console.log("LIFF init error ignored: ", err);
                    });
            } catch (e) {
                console.log("LIFF not available");
            }
        });
    </script>
</body>
</html>
