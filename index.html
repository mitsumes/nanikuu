<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/2/sdk.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 1rem; }
        input, select, textarea { background-color: #2a2a2a !important; color: #ffffff !important; border: 1px solid #3d3d3d !important; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <!-- アクセス制限画面 -->
    <div id="access-restrict" class="fixed inset-0 bg-[#121212] z-50 flex flex-col items-center justify-center p-6 text-center">
        <h2 class="text-xl font-bold text-orange-500 mb-2">⚠️ アクセス制限</h2>
        <p class="text-sm text-gray-300">このアプリはLINEグループ内からのみご利用いただけます。<br>グループのトークルームから開き直してください。</p>
    </div>

    <!-- メインコンテンツ -->
    <div id="main-content" class="hidden space-y-6 pb-12">
        <header class="text-center pt-2">
            <h1 class="text-3xl font-extrabold text-orange-500 tracking-wider">なにクウ？</h1>
            <p class="text-xs text-gray-400 mt-1">ご飯迷った時の決定＆写真共有アプリ</p>
        </header>

        <!-- グループ情報エリア -->
        <div class="card p-4 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-2 overflow-hidden">
                <span class="text-xl">🏠</span>
                <span id="group-name-display" class="font-bold text-lg truncate text-white">読み込み中...</span>
            </div>
            <button onclick="openGroupEdit()" class="bg-zinc-800 hover:bg-zinc-700 text-xs px-3 py-1.5 rounded-lg border border-zinc-600 shrink-0 text-orange-400 font-semibold">
                ✏️ 変更
            </button>
        </div>

        <!-- ルーレットエリア -->
        <div class="card p-4 text-center space-y-3 bg-gradient-to-b from-zinc-900 to-orange-950/30 border-orange-500/30">
            <h2 class="font-bold text-base flex items-center justify-center gap-2 text-white">
                <span>🎰</span> 今日のお店をルーレットで決める
            </h2>
            <div id="roulette-display" class="text-2xl font-black text-orange-400 py-4 tracking-wide min-h-[70px] flex items-center justify-center">
                ボタンを押してね！
            </div>
            <button onclick="startRoulette()" id="roulette-btn" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-lg text-sm transition shadow-lg">
                ルーレットを回す！
            </button>
        </div>

        <!-- みんなの投稿一覧（最新6枚：横2列×縦3列） -->
        <div class="card p-4 space-y-3">
            <h2 class="font-bold text-base flex items-center gap-2 text-white">
                <span>🍴</span> みんなの投稿一覧 <span class="text-xs text-gray-400 font-normal">（最新6件）</span>
            </h2>
            <div id="posts-list" class="grid grid-cols-2 gap-3">
                <p class="text-xs text-gray-400 text-center py-4 col-span-2">読み込み中...</p>
            </div>
        </div>

        <!-- お店を探す・絞り込む -->
        <div class="card p-4 space-y-3">
            <h2 class="font-bold text-base flex items-center gap-2 text-white">
                <span>🔍</span> お店を探す・絞り込む
            </h2>
            <input type="text" id="search-keyword" placeholder="検索ワード（例：おしゃれ、美味しい）" class="w-full p-2.5 rounded-lg text-sm" oninput="filterPosts()">
            <input type="text" id="search-location" placeholder="市名・区名で絞り込む（例：東海市）" class="w-full p-2.5 rounded-lg text-sm" oninput="filterPosts()">
            <select id="search-genre" class="w-full p-2.5 rounded-lg text-sm" onchange="filterPosts()">
                <option value="">すべてのジャンル</option>
                <option value="和食">和食</option>
                <option value="洋食">洋食</option>
                <option value="中華">中華</option>
                <option value="焼肉・肉料理">焼肉・肉料理</option>
                <option value="居酒屋・バー">居酒屋・バー</option>
                <option value="カフェ・スイーツ">カフェ・スイーツ</option>
                <option value="ラーメン・麺類">ラーメン・麺類</option>
                <option value="その他">その他</option>
            </select>
        </div>

        <!-- お店を投稿する -->
        <div class="card p-4 space-y-3">
            <h2 class="font-bold text-base flex items-center gap-2 text-white">
                <span>✏️</span> お店を投稿する
            </h2>
            <form id="post-form" onsubmit="submitPost(event)" class="space-y-3">
                <select id="post-genre" required class="w-full p-2.5 rounded-lg text-sm">
                    <option value="">ジャンルを選択 *</option>
                    <option value="和食">和食</option>
                    <option value="洋食">洋食</option>
                    <option value="中華">中華</option>
                    <option value="焼肉・肉料理">焼肉・肉料理</option>
                    <option value="居酒屋・バー">居酒屋・バー</option>
                    <option value="カフェ・スイーツ">カフェ・スイーツ</option>
                    <option value="ラーメン・麺類">ラーメン・麺類</option>
                    <option value="その他">その他</option>
                </select>
                <input type="text" id="post-name" placeholder="店名 *" required class="w-full p-2.5 rounded-lg text-sm">
                <input type="text" id="post-state" placeholder="国名 / 県名（例：日本 / 愛知県）" class="w-full p-2.5 rounded-lg text-sm">
                <input type="text" id="post-city" placeholder="市名・区名（例：東海市）" class="w-full p-2.5 rounded-lg text-sm">
                <input type="text" id="post-hours" placeholder="営業時間（例：11:00〜22:00）" class="w-full p-2.5 rounded-lg text-sm">
                <input type="text" id="post-budget" placeholder="予算（例：1,000円〜2,000円）" class="w-full p-2.5 rounded-lg text-sm">
                <input type="text" id="post-holiday" placeholder="定休日（例：水曜日、不定休）" class="w-full p-2.5 rounded-lg text-sm">
                <textarea id="post-comment" placeholder="おすすめポイントや感想など" rows="2" class="w-full p-2.5 rounded-lg text-sm"></textarea>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">写真を追加</label>
                    <input type="file" id="post-image" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-zinc-700 file:text-white hover:file:bg-zinc-600">
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-lg text-sm transition">投稿する</button>
            </form>
        </div>
    </div>

    <!-- グループ名編集モーダル -->
    <div id="group-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
        <div class="card p-5 w-full max-w-xs space-y-4">
            <h3 class="font-bold text-base text-white">グループ名の変更</h3>
            <input type="text" id="modal-group-name-input" class="w-full p-2.5 rounded-lg text-sm" placeholder="新しいグループ名">
            <div class="flex space-x-2">
                <button onclick="closeGroupEdit()" class="flex-1 bg-zinc-700 hover:bg-zinc-600 py-2 rounded-lg text-sm text-gray-300">キャンセル</button>
                <button onclick="saveGroupName()" class="flex-1 bg-orange-600 hover:bg-orange-500 py-2 rounded-lg text-sm font-bold text-white">保存</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://nanikuu-default-rtdb.firebaseio.com",
            storageBucket: "nanikuu.firebasestorage.app"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const storage = firebase.storage();

        let currentGroupId = null;
        let allPosts = [];

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                await liff.init({ liffId: "2011348764-dl9CNIS4" });
                if (!liff.isInClient()) {
                    document.getElementById("access-restrict").classList.remove("hidden");
                    return;
                }
                const context = liff.getContext();
                if (context && context.groupId) {
                    currentGroupId = context.groupId;
                } else if (context && context.type === "utou") {
                    currentGroupId = "individual_" + (await liff.getProfile()).userId;
                } else {
                    currentGroupId = "default_group";
                }

                document.getElementById("access-restrict").classList.add("hidden");
                document.getElementById("main-content").classList.remove("hidden");

                initApp();
            } catch (error) {
                console.error("LIFF initialization failed", error);
                currentGroupId = "test_group";
                document.getElementById("access-restrict").classList.add("hidden");
                document.getElementById("main-content").classList.remove("hidden");
                initApp();
            }
        });

        function initApp() {
            loadGroupName();
            loadPosts();
        }

        function loadGroupName() {
            db.ref(`groups/${currentGroupId}/name`).on("value", (snapshot) => {
                const name = snapshot.val() || "グループ1";
                document.getElementById("group-name-display").textContent = name;
            });
        }

        function openGroupEdit() {
            const currentName = document.getElementById("group-name-display").textContent;
            document.getElementById("modal-group-name-input").value = currentName === "読み込み中..." ? "" : currentName;
            document.getElementById("group-modal").classList.remove("hidden");
        }

        function closeGroupEdit() {
            document.getElementById("group-modal").classList.add("hidden");
        }

        function saveGroupName() {
            const newName = document.getElementById("modal-group-name-input").value.trim();
            if (!newName) return;
            db.ref(`groups/${currentGroupId}/name`).set(newName, (error) => {
                if (error) {
                    alert("保存に失敗しました");
                } else {
                    closeGroupEdit();
                }
            });
        }

        function loadPosts() {
            db.ref(`groups/${currentGroupId}/posts`).on("value", (snapshot) => {
                allPosts = [];
                snapshot.forEach((childSnapshot) => {
                    allPosts.push({ id: childSnapshot.key, ...childSnapshot.val() });
                });
                // 新しい順に並び替え
                allPosts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderPosts(allPosts);
            });
        }

        function renderPosts(posts) {
            const listEl = document.getElementById("posts-list");
            if (posts.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-4 col-span-2">条件に合う投稿がありません</p>`;
                return;
            }

            // 最新の最大6枚に絞り込む
            const displayPosts = posts.slice(0, 6);

            listEl.innerHTML = displayPosts.map(p => `
                <div class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl space-y-1.5 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start">
                            <span class="text-[9px] bg-orange-900/60 text-orange-300 px-1.5 py-0.5 rounded font-bold">${escapeHtml(p.genre)}</span>
                            <button onclick="deletePost('${p.id}')" class="text-zinc-500 hover:text-red-400 text-xs px-1">✕</button>
                        </div>
                        <h3 class="font-bold text-xs text-white mt-1 line-clamp-1">${escapeHtml(p.name)}</h3>
                        ${p.city ? `<p class="text-[10px] text-gray-400 line-clamp-1">📍 ${escapeHtml(p.city)}</p>` : ''}
                    </div>
                    ${p.imageUrl ? `<img src="${escapeHtml(p.imageUrl)}" class="w-full h-24 object-cover rounded-lg mt-1">` : ''}
                </div>
            `).join('');
        }

        async function submitPost(event) {
            event.preventDefault();
            const submitBtn = document.getElementById("submit-btn");
            submitBtn.disabled = true;
            submitBtn.textContent = "投稿中...";

            const genre = document.getElementById("post-genre").value;
            const name = document.getElementById("post-name").value;
            const state = document.getElementById("post-state").value;
            const city = document.getElementById("post-city").value;
            const hours = document.getElementById("post-hours").value;
            const budget = document.getElementById("post-budget").value;
            const holiday = document.getElementById("post-holiday").value;
            const comment = document.getElementById("post-comment").value;
            const imageFile = document.getElementById("post-image").files[0];

            let imageUrl = "";
            try {
                if (imageFile) {
                    const storageRef = storage.ref(`images/${currentGroupId}/${Date.now()}_${imageFile.name}`);
                    const snapshot = await storageRef.put(imageFile);
                    imageUrl = await snapshot.ref.getDownloadURL();
                }

                const newPostRef = db.ref(`groups/${currentGroupId}/posts`).push();
                await newPostRef.set({
                    genre, name, state, city, hours, budget, holiday, comment, imageUrl,
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });

                document.getElementById("post-form").reset();
            } catch (error) {
                console.error(error);
                alert("投稿に失敗しました。");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "投稿する";
            }
        }

        function deletePost(postId) {
            if (confirm("この投稿を削除しますか？")) {
                db.ref(`groups/${currentGroupId}/posts/${postId}`).remove();
            }
        }

        function filterPosts() {
            const keyword = document.getElementById("search-keyword").value.toLowerCase();
            const location = document.getElementById("search-location").value.toLowerCase();
            const genre = document.getElementById("search-genre").value;

            const filtered = allPosts.filter(p => {
                const matchKeyword = !keyword || (p.name && p.name.toLowerCase().includes(keyword)) || (p.comment && p.comment.toLowerCase().includes(keyword));
                const matchLocation = !location || (p.state && p.state.toLowerCase().includes(location)) || (p.city && p.city.toLowerCase().includes(location));
                const matchGenre = !genre || p.genre === genre;
                return matchKeyword && matchLocation && matchGenre;
            });
            renderPosts(filtered);
        }

        function startRoulette() {
            if (allPosts.length === 0) {
                alert("お店がまだ投稿されていません！まずは投稿してください。");
                return;
            }

            const display = document.getElementById("roulette-display");
            const btn = document.getElementById("roulette-btn");
            btn.disabled = true;

            let count = 0;
            const maxCount = 20;
            const interval = setInterval(() => {
                const randomPost = allPosts[Math.floor(Math.random() * allPosts.length)];
                display.textContent = randomPost.name;
                count++;

                if (count >= maxCount) {
                    clearInterval(interval);
                    const selected = allPosts[Math.floor(Math.random() * allPosts.length)];
                    display.innerHTML = `🎉 決定：<span class="text-white underline">${escapeHtml(selected.name)}</span> 🎉`;
                    btn.disabled = false;
                }
            }, 80);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`"<>]/g, (match) => ({
                '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '"': '&quot;', '<': '&lt;', '>': '&gt;'
            }[match]));
        }
    </script>
</body>
</html>
