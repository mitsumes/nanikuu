<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - グループ飲食店共有</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Firebase設定
        const firebaseConfig = {
            databaseURL: "https://nanikuu-default-rtdb.firebaseio.com/",
            projectId: "nanikuu",
            storageBucket: "nanikuu.appspot.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        let currentGroupId = "default_group";
        let allRestaurants = [];

        // DOM要素
        const groupInput = document.getElementById("group-input");
        const setGroupBtn = document.getElementById("set-group-btn");
        const groupNameDisplay = document.getElementById("group-name-display");
        
        const latestListEl = document.getElementById("latest-restaurant-list");
        const allListEl = document.getElementById("all-restaurant-list");
        const searchListEl = document.getElementById("search-restaurant-list");
        const loadingEl = document.getElementById("loading");
        const formEl = document.getElementById("restaurant-form");
        const submitBtn = document.getElementById("submit-btn");
        const cancelEditBtn = document.getElementById("cancel-edit");
        const editIdInput = document.getElementById("edit-id");
        const currentPhotoUrlInput = document.getElementById("current-photo-url");
        const currentPhotoPathInput = document.getElementById("current-photo-path");

        // 検索要素
        const searchGenreEl = document.getElementById("search-genre");
        const searchPrefectureEl = document.getElementById("search-prefecture");
        const searchCityEl = document.getElementById("search-city");

        // 詳細モーダル要素
        const detailModal = document.getElementById("detail-modal");
        const detailImage = document.getElementById("detail-image");
        const detailName = document.getElementById("detail-name");
        const detailGenre = document.getElementById("detail-genre");
        const detailRegion = document.getElementById("detail-region");
        const detailScenes = document.getElementById("detail-scenes");
        const detailParking = document.getElementById("detail-parking");
        const detailReservation = document.getElementById("detail-reservation");
        const detailHp = document.getElementById("detail-hp");
        const detailInsta = document.getElementById("detail-insta");
        const detailMemo = document.getElementById("detail-memo");
        const closeDetailBtn = document.getElementById("close-detail");

        // 全件一覧モーダル要素
        const allModal = document.getElementById("all-modal");
        const openAllModalBtn = document.getElementById("open-all-modal");
        const closeAllModalBtn = document.getElementById("close-all-modal");

        // 削除モーダル要素
        const deleteModal = document.getElementById("delete-modal");
        const confirmDeleteBtn = document.getElementById("confirm-delete");
        const cancelDeleteBtn = document.getElementById("cancel-delete");
        let targetDeleteId = null;
        let targetDeletePhotoPath = null;

        // ルーレット関連要素
        const rouletteGenreSelect = document.getElementById("roulette-genre");
        const rouletteRegionInput = document.getElementById("roulette-region");
        const startRouletteBtn = document.getElementById("start-roulette");
        const rouletteResult = document.getElementById("roulette-result");

        // 初期化処理
        async function initLiff() {
            try {
                await liff.init({ liffId: "2011348764-dl9CNIS4" });
                if (liff.isInClient()) {
                    const context = liff.getContext();
                    if (context && context.groupId) {
                        currentGroupId = context.groupId;
                        groupInput.value = currentGroupId;
                    }
                }
            } catch (error) {
                console.error("LIFF Initialization failed", error);
            }
            
            const savedGroup = localStorage.getItem("nanikuu_group_id");
            if (savedGroup) {
                currentGroupId = savedGroup;
                groupInput.value = currentGroupId;
            }

            groupNameDisplay.textContent = currentGroupId;
            loadRestaurants();
        }

        // グループ変更ボタン
        setGroupBtn.addEventListener("click", () => {
            const val = groupInput.value.trim();
            if (!val) {
                alert("グループ名を入力してください");
                return;
            }
            currentGroupId = val;
            localStorage.setItem("nanikuu_group_id", currentGroupId);
            groupNameDisplay.textContent = currentGroupId;
            loadRestaurants();
            alert(`グループ「${currentGroupId}」に切り替えました！`);
        });

        // データのリアルタイム読み込み
        function loadRestaurants() {
            const dbRef = ref(db, 'groups/' + currentGroupId + '/restaurants');
            onValue(dbRef, (snapshot) => {
                loadingEl.classList.add("hidden");
                allRestaurants = [];
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    Object.keys(data).forEach((key) => {
                        allRestaurants.push({ id: key, ...data[key] });
                    });
                    allRestaurants.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                }
                renderRestaurants();
                renderSearchResults();
            }, (error) => {
                console.error("Data load failed", error);
                loadingEl.textContent = "データの読み込みに失敗しました。";
            });
        }

        // リストの描画
        function renderRestaurants() {
            latestListEl.innerHTML = "";
            const latestItems = allRestaurants.slice(0, 6);

            if (latestItems.length === 0) {
                latestListEl.innerHTML = `<div class="col-span-full text-center py-8 text-zinc-500 text-xs">登録されているお店がありません。<br>下のフォームから追加してください！</div>`;
                openAllModalBtn.classList.add("hidden");
            } else {
                openAllModalBtn.classList.remove("hidden");
                latestItems.forEach((item) => {
                    latestListEl.appendChild(createCardElement(item, true));
                });
            }

            allListEl.innerHTML = "";
            if (allRestaurants.length === 0) {
                allListEl.innerHTML = `<div class="text-center py-8 text-zinc-500 text-xs">登録されているお店がありません。</div>`;
            } else {
                allRestaurants.forEach((item) => {
                    allListEl.appendChild(createCardElement(item, false));
                });
            }
        }

        // お店検索の実行と描画
        function renderSearchResults() {
            const genreVal = searchGenreEl.value;
            const prefVal = searchPrefectureEl.value.trim().toLowerCase();
            const cityVal = searchCityEl.value.trim().toLowerCase();

            const filtered = allRestaurants.filter(item => {
                const matchGenre = (genreVal === "すべて" || item.genre === genreVal);
                const matchPref = (prefVal === "" || (item.prefecture && item.prefecture.toLowerCase().includes(prefVal)));
                const matchCity = (cityVal === "" || (item.city && item.city.toLowerCase().includes(cityVal)));
                return matchGenre && matchPref && matchCity;
            });

            searchListEl.innerHTML = "";
            if (filtered.length === 0) {
                searchListEl.innerHTML = `<div class="col-span-full text-center py-6 text-zinc-500 text-xs">条件に一致するお店が見つかりませんでした。</div>`;
            } else {
                filtered.forEach(item => {
                    searchListEl.appendChild(createCardElement(item, true));
                });
            }
        }

        searchGenreEl.addEventListener("change", renderSearchResults);
        searchPrefectureEl.addEventListener("input", renderSearchResults);
        searchCityEl.addEventListener("input", renderSearchResults);

        function createCardElement(item, isCompact) {
            const card = document.createElement("div");
            const imageUrl = item.photoUrl || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=60";
            const locationStr = `${item.city || ''} ${item.prefecture || ''}`.trim() || '未設定';
            
            if (isCompact) {
                card.className = "bg-zinc-900 rounded-xl overflow-hidden flex flex-col justify-between border border-zinc-800 hover:border-zinc-700 transition shadow-md";
                card.innerHTML = `
                    <div class="cursor-pointer" onclick="openDetail('${item.id}')">
                        <div class="h-28 overflow-hidden bg-zinc-800 relative">
                            <img src="${imageUrl}" alt="${item.name}" class="w-full h-full object-cover">
                            <span class="absolute top-1.5 right-1.5 bg-black/70 backdrop-blur-md text-zinc-200 text-[10px] px-2 py-0.5 rounded-full border border-zinc-700">${item.genre || 'その他'}</span>
                        </div>
                        <div class="p-2.5">
                            <h3 class="font-bold text-xs text-white truncate">${item.name}</h3>
                            <div class="flex items-center justify-between mt-1 text-[10px] text-zinc-400">
                                <span class="truncate">📍 ${locationStr}</span>
                            </div>
                        </div>
                    </div>
                    <div class="px-2.5 pb-2.5 pt-0 flex justify-end gap-1.5 border-t border-zinc-800/60 pt-2">
                        <button onclick="startEdit('${item.id}')" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded-lg font-medium transition">編集</button>
                        <button onclick="promptDelete('${item.id}', '${item.photoPath || ''}')" class="text-[10px] bg-red-500/10 hover:bg-red-500/20 text-red-400 px-2 py-1 rounded-lg font-medium transition">削除</button>
                    </div>
                `;
            } else {
                card.className = "bg-zinc-900 rounded-2xl overflow-hidden flex flex-col justify-between border border-zinc-800 hover:border-zinc-700 transition shadow-lg mb-3";
                card.innerHTML = `
                    <div class="cursor-pointer" onclick="openDetail('${item.id}')">
                        <div class="h-36 overflow-hidden bg-zinc-800 relative">
                            <img src="${imageUrl}" alt="${item.name}" class="w-full h-full object-cover">
                            <span class="absolute top-2.5 right-2.5 bg-black/70 backdrop-blur-md text-zinc-200 text-xs px-2.5 py-1 rounded-full border border-zinc-700">${item.genre || 'その他'}</span>
                        </div>
                        <div class="p-3">
                            <h3 class="font-bold text-sm text-white truncate">${item.name}</h3>
                            <div class="flex items-center gap-2 mt-1 text-xs text-zinc-400">
                                <span>📍 ${locationStr}</span>
                            </div>
                        </div>
                    </div>
                    <div class="px-3 pb-3 pt-0 flex justify-end gap-2 border-t border-zinc-800/60 pt-2">
                        <button onclick="openDetail('${item.id}'); closeAllModalBtn.click();" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1 rounded-xl font-medium transition">詳細</button>
                        <button onclick="startEdit('${item.id}'); closeAllModalBtn.click();" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2.5 py-1 rounded-xl font-medium transition">編集</button>
                        <button onclick="promptDelete('${item.id}', '${item.photoPath || ''}')" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 px-2.5 py-1 rounded-xl font-medium transition">削除</button>
                    </div>
                `;
            }
            return card;
        }

        // 写真圧縮関数（Canvas使用）
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        // 詳細モーダル
        window.openDetail = function(id) {
            const item = allRestaurants.find(r => r.id === id);
            if (!item) return;

            detailImage.src = item.photoUrl || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=60";
            detailName.textContent = item.name;
            detailGenre.textContent = item.genre || '未設定';
            detailRegion.textContent = `${item.country || '日本'} ${item.prefecture || ''} ${item.city || ''}`.trim() || '未設定';
            detailScenes.textContent = item.scenes && item.scenes.length > 0 ? item.scenes.join(', ') : '未設定';
            detailParking.textContent = item.parking || '未設定';
            detailReservation.textContent = item.reservation || '未設定';
            
            // HPリンク設定
            if (item.hpUrl) {
                detailHp.innerHTML = `<a href="${item.hpUrl}" target="_blank" class="text-amber-400 underline truncate block">🌐 ホームページを見る</a>`;
                detailHp.classList.remove("hidden");
            } else {
                detailHp.classList.add("hidden");
            }

            // Instagramリンク設定
            if (item.instaUrl) {
                detailInsta.innerHTML = `<a href="${item.instaUrl}" target="_blank" class="text-pink-400 underline truncate block">📸 Instagramを見る</a>`;
                detailInsta.classList.remove("hidden");
            } else {
                detailInsta.classList.add("hidden");
            }

            detailMemo.textContent = item.memo || 'メモなし';

            detailModal.classList.remove("hidden");
            detailModal.classList.add("flex");
        };

        closeDetailBtn.addEventListener("click", () => {
            detailModal.classList.add("hidden");
            detailModal.classList.remove("flex");
        });

        openAllModalBtn.addEventListener("click", () => {
            allModal.classList.remove("hidden");
            allModal.classList.add("flex");
        });

        closeAllModalBtn.addEventListener("click", () => {
            allModal.classList.add("hidden");
            allModal.classList.remove("flex");
        });

        // フォーム送信（追加・編集）
        formEl.addEventListener("submit", async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "投稿中...";

            const name = document.getElementById("restaurant-name").value;
            const genre = document.getElementById("restaurant-genre").value;
            const country = document.getElementById("restaurant-country").value || "日本";
            const prefecture = document.getElementById("restaurant-prefecture").value;
            const city = document.getElementById("restaurant-city").value;
            const hpUrl = document.getElementById("restaurant-hp").value;
            const instaUrl = document.getElementById("restaurant-insta").value;
            
            const scenes = [];
            document.querySelectorAll('input[name="restaurant-scene"]:checked').forEach(cb => {
                scenes.push(cb.value);
            });

            const parking = document.getElementById("restaurant-parking").value;
            const reservation = document.getElementById("restaurant-reservation").value;
            const memo = document.getElementById("restaurant-memo").value;
            const photoFile = document.getElementById("restaurant-photo").files[0];
            const editId = editIdInput.value;
            let photoUrl = currentPhotoUrlInput.value;
            let photoPath = currentPhotoPathInput.value;

            try {
                if (photoFile) {
                    if (photoPath) {
                        try {
                            const oldRef = storageRef(storage, photoPath);
                            await deleteObject(oldRef);
                        } catch (err) {}
                    }
                    // 写真の圧縮処理
                    const compressedBlob = await compressImage(photoFile, 800, 0.7);
                    const newPhotoPath = `images/${currentGroupId}/${Date.now()}_compressed.jpg`;
                    const fileRef = storageRef(storage, newPhotoPath);
                    const snapshot = await uploadBytes(fileRef, compressedBlob);
                    photoUrl = await getDownloadURL(snapshot.ref);
                    photoPath = newPhotoPath;
                }

                const dbRef = ref(db, `groups/${currentGroupId}/restaurants`);
                
                const restaurantData = {
                    name, genre, country, prefecture, city, hpUrl, instaUrl, scenes, parking, reservation, memo, photoUrl, photoPath,
                    updatedAt: Date.now()
                };

                if (editId) {
                    const updateRef = ref(db, `groups/${currentGroupId}/restaurants/${editId}`);
                    await update(updateRef, restaurantData);
                } else {
                    restaurantData.createdAt = Date.now();
                    const newRef = push(dbRef);
                    await set(newRef, restaurantData);
                }

                formEl.reset();
                document.getElementById("restaurant-country").value = "日本"; // デフォルト復元
                resetFormState();
            } catch (error) {
                console.error("保存エラー:", error);
                alert("投稿に失敗しました。もう一度お試しください。");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = editId ? "更新する" : "投稿する";
            }
        });

        window.startEdit = function(id) {
            const item = allRestaurants.find(r => r.id === id);
            if (!item) return;

            editIdInput.value = item.id;
            document.getElementById("restaurant-name").value = item.name;
            document.getElementById("restaurant-genre").value = item.genre || "ラーメン・麺類";
            document.getElementById("restaurant-country").value = item.country || "日本";
            document.getElementById("restaurant-prefecture").value = item.prefecture || "";
            document.getElementById("restaurant-city").value = item.city || "";
            document.getElementById("restaurant-hp").value = item.hpUrl || "";
            document.getElementById("restaurant-insta").value = item.instaUrl || "";
            
            document.querySelectorAll('input[name="restaurant-scene"]').forEach(cb => {
                cb.checked = item.scenes && item.scenes.includes(cb.value);
            });

            document.getElementById("restaurant-parking").value = item.parking || "あり";
            document.getElementById("restaurant-reservation").value = item.reservation || "可";
            document.getElementById("restaurant-memo").value = item.memo || "";
            currentPhotoUrlInput.value = item.photoUrl || "";
            currentPhotoPathInput.value = item.photoPath || "";

            submitBtn.textContent = "更新する";
            cancelEditBtn.classList.remove("hidden");
            formEl.scrollIntoView({ behavior: 'smooth' });
        };

        cancelEditBtn.addEventListener("click", () => {
            formEl.reset();
            document.getElementById("restaurant-country").value = "日本";
            resetFormState();
        });

        function resetFormState() {
            editIdInput.value = "";
            currentPhotoUrlInput.value = "";
            currentPhotoPathInput.value = "";
            submitBtn.textContent = "投稿する";
            cancelEditBtn.classList.add("hidden");
        }

        window.promptDelete = function(id, path) {
            targetDeleteId = id;
            targetDeletePhotoPath = path;
            deleteModal.classList.remove("hidden");
            deleteModal.classList.add("flex");
        };

        cancelDeleteBtn.addEventListener("click", () => {
            deleteModal.classList.add("hidden");
            deleteModal.classList.remove("flex");
            targetDeleteId = null;
            targetDeletePhotoPath = null;
        });

        confirmDeleteBtn.addEventListener("click", async () => {
            if (!targetDeleteId) return;
            try {
                if (targetDeletePhotoPath) {
                    try {
                        const fileRef = storageRef(storage, targetDeletePhotoPath);
                        await deleteObject(fileRef);
                    } catch (err) {}
                }
                const itemRef = ref(db, `groups/${currentGroupId}/restaurants/${targetDeleteId}`);
                await remove(itemRef);
                deleteModal.classList.add("hidden");
                deleteModal.classList.remove("flex");
                targetDeleteId = null;
                targetDeletePhotoPath = null;
            } catch (error) {
                alert("削除に失敗しました。");
            }
        });

        // ルーレット機能
        startRouletteBtn.addEventListener("click", () => {
            if (allRestaurants.length === 0) {
                alert("お店が登録されていません！");
                return;
            }

            const selectedGenre = rouletteGenreSelect.value;
            const regionKeyword = rouletteRegionInput.value.trim().toLowerCase();

            const filtered = allRestaurants.filter(item => {
                const matchGenre = (selectedGenre === "すべて" || item.genre === selectedGenre);
                const regionText = `${item.country || ''} ${item.prefecture || ''} ${item.city || ''}`.toLowerCase();
                const matchRegion = (regionKeyword === "" || regionText.includes(regionKeyword));
                return matchGenre && matchRegion;
            });

            if (filtered.length === 0) {
                rouletteResult.innerHTML = `<p class='text-red-400 text-xs'>条件に合致するお店が見つかりませんでした！</p>`;
                return;
            }

            let count = 0;
            startRouletteBtn.disabled = true;
            
            const timer = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * filtered.length);
                const pick = filtered[randomIndex];
                rouletteResult.innerHTML = `
                    <div class="animate-pulse">
                        <h4 class="text-lg font-bold text-amber-400">${pick.name}</h4>
                        <p class="text-xs text-zinc-400 mt-1">${pick.genre || 'その他'} / ${pick.city || '未設定'}</p>
                    </div>
                `;
                count++;
                if (count > 15) {
                    clearInterval(timer);
                    const finalPick = filtered[Math.floor(Math.random() * filtered.length)];
                    rouletteResult.innerHTML = `
                        <div class="bg-zinc-800/90 border border-amber-500/50 p-4 rounded-2xl w-full text-left space-y-1">
                            <span class="text-[10px] bg-amber-500 text-zinc-950 px-2 py-0.5 rounded-full font-bold">決定！🎉</span>
                            <h4 class="text-xl font-black text-white mt-1">${finalPick.name}</h4>
                            <p class="text-xs text-zinc-300">🍽️ ${finalPick.genre} | 📍 ${finalPick.city || '未設定'}</p>
                            <p class="text-xs text-zinc-400">🅿️ 駐車場:${finalPick.parking} / 予約:${finalPick.reservation}</p>
                            <p class="text-xs text-zinc-400 pt-2 border-t border-zinc-700">メモ: ${finalPick.memo || 'なし'}</p>
                        </div>
                    `;
                    startRouletteBtn.disabled = false;
                }
            }, 100);
        });

        window.addEventListener("DOMContentLoaded", initLiff);
    </script>
</head>
<body class="bg-zinc-950 min-h-screen text-zinc-100 pb-20">

    <!-- ヘッダー -->
    <header class="bg-zinc-900/80 backdrop-blur-md border-b border-zinc-800 sticky top-0 z-10">
        <div class="max-w-md mx-auto px-4 py-3.5 flex justify-between items-center">
            <h1 class="text-lg font-black tracking-wider text-amber-400 flex items-center gap-2">🍽️ なにクウ？</h1>
            <span id="group-name-display" class="text-xs bg-zinc-800 text-zinc-300 font-medium px-3 py-1 rounded-full border border-zinc-700 truncate max-w-[150px]">読み込み中...</span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md mx-auto px-4 py-5 space-y-6">

        <!-- グループ切り替えエリア -->
        <section class="bg-zinc-900 p-3.5 rounded-2xl border border-zinc-800 shadow-lg">
            <label class="block text-xs font-bold text-zinc-400 mb-1.5">グループ名（自由に変更可能）</label>
            <div class="flex gap-2">
                <input type="text" id="group-input" placeholder="例: my-group-name" class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-400">
                <button id="set-group-btn" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold px-4 py-2 rounded-xl text-xs transition">切替</button>
            </div>
        </section>

        <!-- みんなの投稿（最新6件） -->
        <section>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xs font-bold text-zinc-400 uppercase tracking-wider">みんなの投稿（最新6件）</h2>
                <button id="open-all-modal" class="text-xs text-amber-400 hover:underline font-medium hidden">他の投稿もみる →</button>
            </div>
            <div id="loading" class="text-center py-12 text-zinc-500 text-sm">読み込み中...</div>
            <div id="latest-restaurant-list" class="grid grid-cols-2 gap-3">
                <!-- 動的生成 -->
            </div>
        </section>

        <!-- お店検索機能 -->
        <section class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 shadow-xl space-y-3">
            <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider">🔍 お店検索</h2>
            <div class="grid grid-cols-3 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-zinc-400 mb-1">ジャンル</label>
                    <select id="search-genre" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-2 text-xs text-white focus:outline-none">
                        <option value="すべて">すべて</option>
                        <option value="ラーメン・麺類">ラーメン・麺類</option>
                        <option value="町中華">町中華</option>
                        <option value="和食">和食</option>
                        <option value="洋食">洋食</option>
                        <option value="焼肉">焼肉</option>
                        <option value="寿司">寿司</option>
                        <option value="カフェ">カフェ</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-zinc-400 mb-1">県名</label>
                    <input type="text" id="search-prefecture" placeholder="例: 愛知県" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-2 text-xs text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-zinc-400 mb-1">市町村</label>
                    <input type="text" id="search-city" placeholder="例: 半田市" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-2 text-xs text-white focus:outline-none">
                </div>
            </div>
            <div id="search-restaurant-list" class="grid grid-cols-2 gap-3 pt-2">
                <!-- 検索結果生成 -->
            </div>
        </section>

        <!-- 投稿フォーム -->
        <section class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 shadow-xl">
            <h2 class="text-sm font-bold text-zinc-200 mb-4 pb-2 border-b border-zinc-800">お店を投稿・編集する</h2>
            <form id="restaurant-form" class="space-y-4">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="current-photo-url">
                <input type="hidden" id="current-photo-path">

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">店名 <span class="text-amber-400">*</span></label>
                    <input type="text" id="restaurant-name" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-400">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">ジャンル</label>
                    <select id="restaurant-genre" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-400">
                        <option value="ラーメン・麺類">ラーメン・麺類</option>
                        <option value="町中華">町中華</option>
                        <option value="和食">和食</option>
                        <option value="洋食">洋食</option>
                        <option value="焼肉">焼肉</option>
                        <option value="寿司">寿司</option>
                        <option value="カフェ">カフェ</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <!-- 地域詳細入力 -->
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-zinc-400 mb-1">国名</label>
                        <input type="text" id="restaurant-country" value="日本" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-zinc-400 mb-1">県名</label>
                        <input type="text" id="restaurant-prefecture" placeholder="愛知県" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-400">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-zinc-400 mb-1">市町村</label>
                        <input type="text" id="restaurant-city" placeholder="半田市" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-400">
                    </div>
                </div>

                <!-- リンク入力欄 -->
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 mb-1">ホームページ URL</label>
                        <input type="url" id="restaurant-hp" placeholder="https://example.com" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 mb-1">Instagram URL</label>
                        <input type="url" id="restaurant-insta" placeholder="https://instagram.com/..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-amber-400">
                    </div>
                </div>

                <!-- 利用シーン（複数選択） -->
                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">利用シーン（複数選択可）</label>
                    <div class="flex gap-4 text-xs text-zinc-300 bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="restaurant-scene" value="1人向け" class="accent-amber-500"> 1人向け</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="restaurant-scene" value="ファミリー向け" class="accent-amber-500"> ファミリー</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="restaurant-scene" value="グループ向け" class="accent-amber-500"> グループ</label>
                    </div>
                </div>

                <!-- 駐車場・予約 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 mb-1">駐車場</label>
                        <select id="restaurant-parking" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                            <option value="あり">あり</option>
                            <option value="なし">なし</option>
                            <option value="近隣にコインパーキング">近隣コインパ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-zinc-400 mb-1">予約</label>
                        <select id="restaurant-reservation" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                            <option value="可">可</option>
                            <option value="不可">不可</option>
                            <option value="不明">不明</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">写真（自動圧縮されます）</label>
                    <input type="file" id="restaurant-photo" accept="image/*" class="w-full text-xs text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-amber-400 hover:file:bg-zinc-700">
                </div>

                <div>
                    <label class="block text-xs font-bold text-zinc-400 mb-1">メモ・おすすめポイント</label>
                    <textarea id="restaurant-memo" rows="2" placeholder="例: 唐揚げが美味しい" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-amber-400"></textarea>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="submit-btn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-3 px-4 rounded-xl text-sm shadow transition">投稿する</button>
                    <button type="button" id="cancel-edit" class="hidden bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-3 px-4 rounded-xl text-sm transition">キャンセル</button>
                </div>
            </form>
        </section>

        <!-- お店ルーレット（一番下） -->
        <section class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 shadow-xl space-y-4">
            <h2 class="text-sm font-black text-amber-400 flex items-center gap-2">🎰 お店ルーレット</h2>
            
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-zinc-400 mb-1">ジャンル選択</label>
                    <select id="roulette-genre" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                        <option value="すべて">すべて</option>
                        <option value="ラーメン・麺類">ラーメン・麺類</option>
                        <option value="町中華">町中華</option>
                        <option value="和食">和食</option>
                        <option value="洋食">洋食</option>
                        <option value="焼肉">焼肉</option>
                        <option value="寿司">寿司</option>
                        <option value="カフェ">カフェ</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-zinc-400 mb-1">地区名（キーワード）</label>
                    <input type="text" id="roulette-region" placeholder="例: 半田市" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                </div>
            </div>

            <div id="roulette-result" class="py-4 text-center min-h-[80px] flex items-center justify-center bg-zinc-950 rounded-xl border border-zinc-800/80">
                <p class="text-zinc-500 text-xs">条件を選んでスタートを押してね！</p>
            </div>

            <button id="start-roulette" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:opacity-95 text-zinc-950 font-extrabold py-3.5 rounded-xl text-sm shadow-lg shadow-amber-500/20 transition">ルーレットスタート！</button>
        </section>

    </main>

    <!-- 全件一覧モーダル -->
    <div id="all-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 rounded-3xl max-w-sm w-full max-h-[85vh] flex flex-col shadow-2xl border border-zinc-800 overflow-hidden">
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-900/90">
                <h3 class="font-bold text-white text-sm">すべての投稿一覧</h3>
                <button id="close-all-modal" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-xl font-medium transition">閉じる</button>
            </div>
            <div id="all-restaurant-list" class="p-4 overflow-y-auto space-y-3 flex-1">
                <!-- 動的生成 -->
            </div>
        </div>
    </div>

    <!-- 詳細モーダル -->
    <div id="detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl border border-zinc-800">
            <div class="h-52 bg-zinc-800 relative">
                <img id="detail-image" src="" alt="" class="w-full h-full object-cover">
            </div>
            <div class="p-5 space-y-3 text-xs">
                <div>
                    <span id="detail-genre" class="bg-zinc-800 text-amber-400 px-2.5 py-1 rounded-full font-medium border border-zinc-700"></span>
                    <h3 id="detail-name" class="text-lg font-bold text-white mt-2"></h3>
                </div>
                <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800 space-y-1.5">
                    <p>📍 地域: <strong id="detail-region" class="text-white"></strong></p>
                    <p>👥 利用シーン: <strong id="detail-scenes" class="text-zinc-200"></strong></p>
                    <p>🅿️ 駐車場: <strong id="detail-parking" class="text-zinc-200"></strong> | 予約: <strong id="detail-reservation" class="text-zinc-200"></strong></p>
                </div>
                <div id="detail-links" class="space-y-1.5">
                    <div id="detail-hp" class="hidden"></div>
                    <div id="detail-insta" class="hidden"></div>
                </div>
                <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                    <p class="font-bold text-zinc-500 mb-1">メモ</p>
                    <p id="detail-memo" class="text-zinc-300 whitespace-pre-wrap"></p>
                </div>
                <button id="close-detail" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-3 rounded-xl text-sm transition">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 削除確認モーダル -->
    <div id="delete-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 rounded-3xl max-w-xs w-full p-6 text-center shadow-2xl border border-zinc-800 space-y-4">
            <div class="text-3xl">⚠️</div>
            <h3 class="font-bold text-white text-base">本当に削除しますか？</h3>
            <div class="flex gap-2 pt-2">
                <button id="cancel-delete" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold py-3 rounded-xl text-sm transition">いいえ</button>
                <button id="confirm-delete" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl text-sm transition">削除する</button>
            </div>
        </div>
    </div>

</body>
</html>
