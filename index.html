<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？</title>
    <!-- LIFF SDKの読み込み -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Firebaseの読み込み（必要に応じてご自身の環境に合わせてください） -->
    <script type="module">
      // Firebase等の初期化ロジックがここにある場合はそのまま維持してください
    </script>
    <style>
        /* ここにお使いのデザインCSSが入ります */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
        }
        h1, h2 {
            color: #ff5722;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        /* その他のスタイル */
    </style>
</head>
<body>
    <div class="container">
        <h1>なにクウ？</h1>
        <p>ご飯迷った時の決定＆写真共有アプリ</p>

        <!-- 投稿一覧などのセクション -->
        <div id="app">
            <!-- 動的に表示されるコンテンツ -->
        </div>
    </div>

    <!-- アプリの動作およびLIFFセキュリティ設定用のJavaScript -->
    <script>
        let currentUserName = "ゲスト";

        // LIFFの初期化 ＆ 未ログインならログインを促すセキュリティガード
        document.addEventListener("DOMContentLoaded", () => {
            try {
                liff.init({ liffId: "2011348764-TFzS41F9" }).then(() => {
                    // LINEアプリ外（普通のブラウザなど）で開いた場合、自動でログインを促す
                    if (!liff.isInClient() && !liff.isLoggedIn()) {
                        liff.login();
                    } else if (liff.isLoggedIn()) {
                        liff.getProfile().then(profile => {
                            currentUserName = profile.displayName;
                            const authorInput = document.getElementById('author');
                            if (authorInput) {
                                authorInput.value = currentUserName;
                            }
                        }).catch((err) => {
                            console.log("Failed to get profile: ", err);
                        });
                    }
                }).catch((err) => {
                    console.log("LIFF initialization skipped/failed: ", err);
                });
            } catch (e) {
                console.log("LIFF not available");
            }
        });
    </script>
</body>
</html>
