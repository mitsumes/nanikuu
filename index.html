<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なにクウ？ - グループ飲食店共有</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Firebase設定（Storageバケットを最新の正しい形式に修正）
        const firebaseConfig = {
            databaseURL: "https://nanikuu-default-rtdb.firebaseio.com/",
            projectId: "nanikuu",
            storageBucket: "nanikuu.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        let currentGroupId = "default_group";
        let allRestaurants = [];
        let currentUserName = "ゲストユーザー";

        let targetDeleteId = null;
        let targetDeletePhotoPath = null;

        // DOM要素の取得と安全な初期化
        document.addEventListener("DOMContentLoaded", () => {
            const groupNameDisplay = document.getElementById("group-name-display");
            const editGroupBtn = document.getElementById("edit-group-btn");
            const groupEditContainer = document.getElementById("group-edit-container");
            const groupInput = document.getElementById("group-input");
            const saveGroupBtn = document.getElementById("save-group-btn");
            const cancelGroupBtn = document.getElementById("cancel-group-btn");
            
            const latestListEl = document.getElementById("latest-restaurant-list");
            const allListEl = document.getElementById("all-restaurant-list");
            const loadingEl = document.getElementById("loading");
            const formEl = document.getElementById("restaurant-form");
            const submitBtn = document.getElementById("submit-btn");
            const cancelEditBtn = document.getElementById("cancel-edit");
            const editIdInput = document.getElementById("edit-id");
            const currentPhotoUrlInput = document.getElementById("current-photo-url");
            const currentPhotoPathInput = document.getElementById("current-photo-path");

            // 検索要素
            const searchGenreEl = document.getElementById("search-genre");
            const searchPrefectureEl = document.getElementById("search-prefecture");
            const searchCityEl = document.getElementById("search-city");
            const searchKeywordEl = document.getElementById("search-keyword");
            const executeSearchBtn = document.getElementById("execute-search-btn");

            // 詳細モーダル要素
            const detailModal = document.getElementById("detail-modal");
            const detailImage = document.getElementById("detail-image");
            const detailName = document.getElementById("detail-name");
            const detailGenre = document.getElementById("detail-genre");
            const detailRegion = document.getElementById("detail-region");
            const detailScenes = document.getElementById("detail-scenes");
            const detailParking = document.getElementById("detail-parking");
            const detailReservation = document.getElementById("detail-reservation");
            const detailAuthor = document.getElementById("detail-author");
            const detailHp = document.getElementById("detail-hp");
            const detailInsta = document.getElementById("detail-insta");
            const detailMemo = document.getElementById("detail-memo");
            const detailActionButtons = document.getElementById("detail-action-buttons");
            const closeDetailBtn = document.getElementById("close-detail");

            // 検索結果モーダル要素
            const searchResultModal = document.getElementById("search-result-modal");
            const searchResultListEl = document.getElementById("search-result-list");
            const closeSearchResultModalBtn = document.getElementById("close-search-result-modal");

            // 全件一覧モーダル要素
            const allModal = document.getElementById("all-modal");
            const openAllModalBtn = document.getElementById("open-all-modal");
            const closeAllModalBtn = document.getElementById("close-all-modal");

            // 削除モーダル要素
            const deleteModal = document.getElementById("delete-modal");
            const confirmDeleteBtn = document.getElementById("confirm-delete");
            const cancelDeleteBtn = document.getElementById("cancel-delete");

            // ルーレット関連要素
            const rouletteGenreSelect = document.getElementById("roulette-genre");
            const rouletteRegionInput = document.getElementById("roulette-region");
            const startRouletteBtn = document.getElementById("start-roulette");
            const rouletteResult = document.getElementById("roulette-result");

            // 初期化処理（LIFF & ユーザー名取得）
            async function initLiff() {
                try {
                    await liff.init({ liffId: "2011348764-dl9CNIS4" });
                    if (liff.isLoggedIn()) {
                        const profile = await liff.getProfile();
                        currentUserName = profile.displayName;
                    }
                    if (liff.isInClient()) {
                        const context = liff.getContext();
                        if (context && context.groupId) {
                            currentGroupId = context.groupId;
                        }
                    }
                } catch (error) {
                    console.error("LIFF Initialization failed", error);
                }
                
                const savedGroup = localStorage.getItem("nanikuu_group_id");
                if (savedGroup) {
                    currentGroupId = savedGroup;
                }

                if (groupNameDisplay) groupNameDisplay.textContent = currentGroupId;
                if (groupInput) groupInput.value = currentGroupId;
                loadRestaurants();
            }

            if (editGroupBtn) {
                editGroupBtn.addEventListener("click", () => {
                    groupEditContainer.classList.toggle("hidden");
                    groupInput.value = currentGroupId;
                });
            }

            if (cancelGroupBtn) {
                cancelGroupBtn.addEventListener("click", () => {
                    groupEditContainer.classList.add("hidden");
                });
            }

            if (saveGroupBtn) {
                saveGroupBtn.addEventListener("click", () => {
                    const val = groupInput.value.trim();
                    if (!val) {
                        alert("グループ名を入力してください");
                        return;
                    }
                    currentGroupId = val;
                    localStorage.setItem("nanikuu_group_id", currentGroupId);
                    groupNameDisplay.textContent = currentGroupId;
                    groupEditContainer.classList.add("hidden");
                    loadRestaurants();
                });
            }

            // データのリアルタイム読み込み
            function loadRestaurants() {
                const dbRef = ref(db, 'groups/' + currentGroupId + '/restaurants');
                onValue(dbRef, (snapshot) => {
                    if (loadingEl) loadingEl.classList.add("hidden");
                    allRestaurants = [];
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        Object.keys(data).forEach((key) => {
                            allRestaurants.push({ id: key, ...data[key] });
                        });
                        allRestaurants.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    }
                    renderRestaurants();
                }, (error) => {
                    console.error("Data load failed", error);
                    if (loadingEl) loadingEl.textContent = "データの読み込みに失敗しました。";
                });
            }

            // リストの描画
            function renderRestaurants() {
                if (!latestListEl || !allListEl) return;
                latestListEl.innerHTML = "";
                const latestItems = allRestaurants.slice(0, 6);

                if (latestItems.length === 0) {
                    latestListEl.innerHTML = `<div class="col-span-full text-center py-8 text-zinc-500 text-xs">登録されているお店がありません。<br>下のフォームから投稿してください！</div>`;
                    if (openAllModalBtn) openAllModalBtn.classList.add("hidden");
                } else {
                    if (openAllModalBtn) openAllModalBtn.classList.remove("hidden");
                    latestItems.forEach((item) => {
                        latestListEl.appendChild(createCardElement(item));
                    });
                }

                allListEl.innerHTML = "";
                if (allRestaurants.length === 0) {
                    allListEl.innerHTML = `<div class="text-center py-8 text-zinc-500 text-xs">登録されているお店がありません。</div>`;
                } else {
                    allRestaurants.forEach((item) => {
                        allListEl.appendChild(createCardElement(item));
                    });
                }
            }

            // 検索ボタン押下時の処理
            if (executeSearchBtn) {
                executeSearchBtn.addEventListener("click", () => {
                    const genreVal = searchGenreEl.value;
                    const prefVal = searchPrefectureEl.value.trim().toLowerCase();
                    const cityVal = searchCityEl.value.trim().toLowerCase();
                    const keywordVal = searchKeywordEl.value.trim().toLowerCase();

                    const filtered = allRestaurants.filter(item => {
                        const matchGenre = (genreVal === "すべて" || item.genre === genreVal);
                        const matchPref = (prefVal === "" || (item.prefecture && item.prefecture.toLowerCase().includes(prefVal)));
                        const matchCity = (cityVal === "" || (item.city && item.city.toLowerCase().includes(cityVal)));
                        
                        const fullText = `${item.name || ''} ${item.genre || ''} ${item.memo || ''} ${item.prefecture || ''} ${item.city || ''} ${item.author || ''}`.toLowerCase();
                        const matchKeyword = (keywordVal === "" || fullText.includes(keywordVal));

                        return matchGenre && matchPref && matchCity && matchKeyword;
                    });

                    searchResultListEl.innerHTML = "";
                    if (filtered.length === 0) {
                        searchResultListEl.innerHTML = `<div class="text-center py-8 text-zinc-500 text-xs col-span-2">条件に一致するお店が見つかりませんでした。</div>`;
                    } else {
                        filtered.forEach(item => {
                            searchResultListEl.appendChild(createCardElement(item));
                        });
                    }

                    searchResultModal.classList.remove("hidden");
                    searchResultModal.classList.add("flex");
                });
            }

            if (closeSearchResultModalBtn) {
                closeSearchResultModalBtn.addEventListener("click", () => {
                    searchResultModal.classList.add("hidden");
                    searchResultModal.classList.remove("flex");
                });
            }

            function createCardElement(item) {
                const card = document.createElement("div");
                const imageUrl = item.photoUrl || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=60";
                const locationStr = `${item.city || ''} ${item.prefecture || ''}`.trim() || '未設定';
                
                card.className = "bg-zinc-900 rounded-xl overflow-hidden flex flex-col justify-between border border-zinc-800 hover:border-zinc-700 transition shadow-md cursor-pointer";
                card.onclick = () => {
                    if (searchResultModal) {
                        searchResultModal.classList.add("hidden");
                        searchResultModal.classList.remove("flex");
                    }
                    if (allModal) {
                        allModal.classList.add("hidden");
                        allModal.classList.remove("flex");
                    }
                    openDetail(item.id);
                };
                
                card.innerHTML = `
                    <div class="h-28 overflow-hidden bg-zinc-800 relative">
                        <img src="${imageUrl}" alt="${item.name}" class="w-full h-full object-cover">
                        <span class="absolute top-1.5 right-1.5 bg-black/70 backdrop-blur-md text-zinc-200 text-[10px] px-2 py-0.5 rounded-full border border-zinc-700">${item.genre || 'その他'}</span>
                    </div>
                    <div class="p-2.5">
                        <h3 class="font-bold text-xs text-white truncate">${item.name}</h3>
                        <div class="flex items-center justify-between mt-1 text-[10px] text-zinc-400">
                            <span class="truncate">📍 ${locationStr}</span>
                        </div>
                    </div>
                `;
                return card;
            }

            // 絶対にフリーズしない写真圧縮関数（最大3秒でタイムアウトして元ファイルを返す）
            function compressImage(file, maxWidth = 800, quality = 0.7) {
                return new Promise((resolve) => {
                    if (!file || !file.type.startsWith('image/')) {
                        resolve(file);
                        return;
                    }

                    let isFinished = false;
                    const timer = setTimeout(() => {
                        if (!isFinished) {
                            isFinished = true;
                            resolve(file);
                        }
                    }, 3000);

                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onerror = () => {
                        if (!isFinished) { isFinished = true; clearTimeout(timer); resolve(file); }
                    };
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onerror = () => {
                            if (!isFinished) { isFinished = true; clearTimeout(timer); resolve(file); }
                        };
                        img.src = event.target.result;
                        img.onload = () => {
                            if (isFinished) return;
                            try {
                                const canvas = document.createElement('canvas');
                                let width = img.width;
                                let height = img.height;

                                if (width > maxWidth) {
                                    height = Math.round((height * maxWidth) / width);
                                    width = maxWidth;
                                }

                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, width, height);

                                canvas.toBlob((blob) => {
                                    if (!isFinished) {
                                        isFinished = true;
                                        clearTimeout(timer);
                                        resolve(blob || file);
                                    }
                                }, 'image/jpeg', quality);
                            } catch (e) {
                                if (!isFinished) { isFinished = true; clearTimeout(timer); resolve(file); }
                            }
                        };
                    };
                });
            }

            // 詳細モーダル表示
            window.openDetail = function(id) {
                const item = allRestaurants.find(r => r.id === id);
                if (!item) return;

                if (detailImage) detailImage.src = item.photoUrl || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=60";
                if (detailName) detailName.textContent = item.name;
                if (detailGenre) detailGenre.textContent = item.genre || '未設定';
                if (detailRegion) detailRegion.textContent = `${item.country || '日本'} ${item.prefecture || ''} ${item.city || ''}`.trim() || '未設定';
                if (detailScenes) detailScenes.textContent = item.scenes && item.scenes.length > 0 ? item.scenes.join(', ') : '未設定';
                if (detailParking) detailParking.textContent = item.parking || '未設定';
                if (detailReservation) detailReservation.textContent = item.reservation || '未設定';
                if (detailAuthor) detailAuthor.textContent = item.author || '不明';
                
                if (detailHp) {
                    if (item.hpUrl) {
                        detailHp.innerHTML = `<a href="${item.hpUrl}" target="_blank" class="text-amber-400 underline truncate block">🌐 ホームページを見る</a>`;
                        detailHp.classList.remove("hidden");
                    } else {
                        detailHp.classList.add("hidden");
                    }
                }

                if (detailInsta) {
                    if (item.instaUrl) {
                        detailInsta.innerHTML = `<a href="${item.instaUrl}" target="_blank" class="text-pink-400 underline truncate block">📸 Instagramを見る</a>`;
                        detailInsta.classList.remove("hidden");
                    } else {
                        detailInsta.classList.add("hidden");
                    }
                }

                if (detailMemo) detailMemo.textContent = item.memo || 'メモなし';

                if (detailActionButtons) {
                    detailActionButtons.innerHTML = `
                        <div class="flex gap-2 pt-2 border-t border-zinc-800 mt-2">
                            <button onclick="window.closeDetailAndEdit('${item.id}')" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-2.5 rounded-xl text-xs transition">編集する</button>
                            <button onclick="window.closeDetailAndPromptDelete('${item.id}', '${item.photoPath || ''}')" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-xl text-xs transition">削除する</button>
                        </div>
                    `;
                }

                if (detailModal) {
                    detailModal.classList.remove("hidden");
                    detailModal.classList.add("flex");
                }
            };

            window.closeDetailAndEdit = function(id) {
                if (detailModal) {
                    detailModal.classList.add("hidden");
                    detailModal.classList.remove("flex");
                }
                startEdit(id);
            };

            window.closeDetailAndPromptDelete = function(id, path) {
                if (detailModal) {
                    detailModal.classList.add("hidden");
                    detailModal.classList.remove("flex");
                }
                promptDelete(id, path);
            };

            if (closeDetailBtn) {
                closeDetailBtn.addEventListener("click", () => {
                    detailModal.classList.add("hidden");
                    detailModal.classList.remove("flex");
                });
            }

            if (openAllModalBtn) {
                openAllModalBtn.addEventListener("click", () => {
                    allModal.classList.remove("hidden");
                    allModal.classList.add("flex");
                });
            }

            if (closeAllModalBtn) {
                closeAllModalBtn.addEventListener("click", () => {
                    allModal.classList.add("hidden");
                    allModal.classList.remove("flex");
                });
            }

            // フォーム送信（投稿・編集）
            if (formEl) {
                formEl.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.textContent = "投稿中...";
                    }

                    const name = document.getElementById("restaurant-name").value;
                    const genre = document.getElementById("restaurant-genre").value;
                    const country = document.getElementById("restaurant-country").value || "日本";
                    const prefecture = document.getElementById("restaurant-prefecture").value;
                    const city = document.getElementById("restaurant-city").value;
                    const hpUrl = document.getElementById("restaurant-hp").value;
                    const instaUrl = document.getElementById("restaurant-insta").value;
                    
                    const scenes = [];
                    document.querySelectorAll('input[name="restaurant-scene"]:checked').forEach(cb => {
                        scenes.push(cb.value);
                    });

                    const parking = document.getElementById("restaurant-parking").value;
                    const reservation = document.getElementById("restaurant-reservation").value;
                    const memo = document.getElementById("restaurant-memo").value;
                    const photoFile = document.getElementById("restaurant-photo").files[0];
                    const editId = editIdInput.value;
                    let photoUrl = currentPhotoUrlInput.value;
                    let photoPath = currentPhotoPathInput.value;

                    try {
                        if (photoFile) {
                            if (photoPath) {
                                try {
                                    const oldRef = storageRef(storage, photoPath);
                                    await deleteObject(oldRef);
                                } catch (err) {}
                            }
                            const compressedBlob = await compressImage(photoFile, 800, 0.7);
                            const newPhotoPath = `images/${currentGroupId}/${Date.now()}_compressed.jpg`;
                            const fileRef = storageRef(storage, newPhotoPath);
                            const snapshot = await uploadBytes(fileRef, compressedBlob);
                            photoUrl = await getDownloadURL(snapshot.ref);
                            photoPath = newPhotoPath;
                        }

                        const dbRef = ref(db, `groups/${currentGroupId}/restaurants`);
                        
                        const restaurantData = {
                            name, genre, country, prefecture, city, hpUrl, instaUrl, scenes, parking, reservation, memo, photoUrl, photoPath,
                            author: currentUserName,
                            updatedAt: Date.now()
                        };

                        if (editId) {
                            const updateRef = ref(db, `groups/${currentGroupId}/restaurants/${editId}`);
                            await update(updateRef, restaurantData);
                        } else {
                            restaurantData.createdAt = Date.now();
                            const newRef = push(dbRef);
                            await set(newRef, restaurantData);
                        }

                        formEl.reset();
                        document.getElementById("restaurant-country").value = "日本";
                        resetFormState();
                    } catch (error) {
                        console.error("保存エラー:", error);
                        alert("投稿に失敗しました。もう一度お試しください。");
                    } finally {
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.textContent = editId ? "更新する" : "投稿する";
                        }
                    }
                });
            }

            function startEdit(id) {
                const item = allRestaurants.find(r => r.id === id);
                if (!item) return;

                editIdInput.value = item.id;
                document.getElementById("restaurant-name").value = item.name;
                document.getElementById("restaurant-genre").value = item.genre || "ラーメン・麺類";
                document.getElementById("restaurant-country").value = item.country || "日本";
                document.getElementById("restaurant-prefecture").value = item.prefecture || "";
                document.getElementById("restaurant-city").value = item.city || "";
                document.getElementById("restaurant-hp").value = item.hpUrl || "";
                document.getElementById("restaurant-insta").value = item.instaUrl || "";
                
                document.querySelectorAll('input[name="restaurant-scene"]').forEach(cb => {
                    cb.checked = item.scenes && item.scenes.includes(cb.value);
                });

                document.getElementById("restaurant-parking").value = item.parking || "あり";
                document.getElementById("restaurant-reservation").value = item.reservation || "可";
                document.getElementById("restaurant-memo").value = item.memo || "";
                currentPhotoUrlInput.value = item.photoUrl || "";
                currentPhotoPathInput.value = item.photoPath || "";

                if (submitBtn) submitBtn.textContent = "更新する";
                if (cancelEditBtn) cancelEditBtn.classList.remove("hidden");
                if (formEl) formEl.scrollIntoView({ behavior: 'smooth' });
            }

            if (cancelEditBtn) {
                cancelEditBtn.addEventListener("click", () => {
                    if (formEl) formEl.reset();
                    document.getElementById("restaurant-country").value = "日本";
                    resetFormState();
                });
            }

            function resetFormState() {
                editIdInput.value = "";
                currentPhotoUrlInput.value = "";
                currentPhotoPathInput.value = "";
                if (submitBtn) submitBtn.textContent = "投稿する";
                if (cancelEditBtn) cancelEditBtn.classList.add("hidden");
            }

            // 削除確認モーダルを表示
            function promptDelete(id, path) {
                targetDeleteId = id;
                targetDeletePhotoPath = path;
                if (deleteModal) {
                    deleteModal.classList.remove("hidden");
                    deleteModal.classList.add("flex");
                }
            }

            if (cancelDeleteBtn) {
                cancelDeleteBtn.addEventListener("click", () => {
                    if (deleteModal) {
                        deleteModal.classList.add("hidden");
                        deleteModal.classList.remove("flex");
                    }
                    targetDeleteId = null;
                    targetDeletePhotoPath = null;
                });
            }

            if (confirmDeleteBtn) {
                confirmDeleteBtn.addEventListener("click", async () => {
                    if (!targetDeleteId) return;
                    try {
                        if (targetDeletePhotoPath) {
                            try {
                                const fileRef = storageRef(storage, targetDeletePhotoPath);
                                await deleteObject(fileRef);
                            } catch (err) {}
                        }
                        const itemRef = ref(db, `groups/${currentGroupId}/restaurants/${targetDeleteId}`);
                        await remove(itemRef);
                        if (deleteModal) {
                            deleteModal.classList.add("hidden");
                            deleteModal.classList.remove("flex");
                        }
                        targetDeleteId = null;
                        targetDeletePhotoPath = null;
                    } catch (error) {
                        alert("削除に失敗しました。");
                    }
                });
            }

            // ルーレット機能
            if (startRouletteBtn) {
                startRouletteBtn.addEventListener("click", () => {
                    if (allRestaurants.length === 0) {
                        alert("お店が登録されていません！");
                        return;
                    }

                    const selectedGenre = rouletteGenreSelect.value;
                    const regionKeyword = rouletteRegionInput.value.trim().toLowerCase();

                    const filtered = allRestaurants.filter(item => {
                        const matchGenre = (selectedGenre === "すべて" || item.genre === selectedGenre);
                        const regionText = `${item.country || ''} ${item.prefecture || ''} ${item.city || ''}`.toLowerCase();
                        const matchRegion = (regionKeyword === "" || regionText.includes(regionKeyword));
                        return matchGenre && matchRegion;
                    });

                    if (filtered.length === 0) {
                        if (rouletteResult) rouletteResult.innerHTML = `<p class='text-red-400 text-xs'>条件に合致するお店が見つかりませんでした！</p>`;
                        return;
                    }
